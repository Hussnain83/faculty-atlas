<title>Faculty Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Geist:wght@400..700&family=Geist+Mono:wght@400..600&display=swap">
<style>
/* Layout: frosted sidebar + bento content floating over an aurora field of drifting research numbers */
:root{
  --bg:#F3F6F9; --ink:#0D1B2A; --ink-2:#44566A; --ink-3:#7B8B9D; --line:rgba(13,27,42,.08); --line-2:rgba(13,27,42,.14);
  --glass:rgba(255,255,255,.62); --glass-strong:rgba(255,255,255,.84); --glass-edge:rgba(255,255,255,.95); --white:#fff;
  --lagoon:#0C9AA6; --lagoon-deep:#07737C; --coral:#F2614C; --saffron:#EE9B12; --iris:#5864EC; --mint:#1FA872;
  --lagoon-glow:rgba(12,154,166,.32); --coral-glow:rgba(242,97,76,.22); --saffron-glow:rgba(238,155,18,.22); --iris-glow:rgba(88,100,236,.22);
  --f-display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --f-body:'Geist','Inter','Segoe UI',system-ui,-apple-system,sans-serif;
  --f-mono:'Geist Mono',ui-monospace,'SFMono-Regular',Consolas,monospace;
  --r-xl:28px; --r-lg:22px; --r-md:14px; --r-sm:10px;
  --shadow:0 1px 1px rgba(13,27,42,.03),0 10px 28px -12px rgba(13,27,42,.14),0 30px 60px -36px rgba(12,154,166,.28);
  --shadow-lift:0 2px 2px rgba(13,27,42,.04),0 18px 40px -14px rgba(13,27,42,.2),0 40px 70px -40px rgba(12,154,166,.4);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--bg)}
h1,h2,h3,h4,h5{font-family:var(--f-display);margin:0;letter-spacing:-.015em;text-wrap:balance;color:var(--ink)}
p{margin:0}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--lagoon);outline-offset:2px;border-radius:8px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* atmosphere */
.aurora{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora i{position:absolute;border-radius:50%;filter:blur(70px);animation:drift 40s ease-in-out infinite alternate}
.aurora i:nth-child(1){width:60vw;height:60vw;left:-18vw;top:-24vw;background:radial-gradient(circle,var(--lagoon-glow),transparent 64%)}
.aurora i:nth-child(2){width:48vw;height:48vw;right:-14vw;top:-8vw;background:radial-gradient(circle,var(--coral-glow),transparent 64%);animation-duration:52s}
.aurora i:nth-child(3){width:52vw;height:52vw;left:30vw;bottom:-30vw;background:radial-gradient(circle,var(--saffron-glow),transparent 64%);animation-duration:46s}
.aurora i:nth-child(4){width:38vw;height:38vw;left:-8vw;bottom:-10vw;background:radial-gradient(circle,var(--iris-glow),transparent 64%);animation-duration:58s}
@keyframes drift{to{transform:translate3d(6vw,4vw,0) scale(1.12)}}
#field{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}

/* shell */
.app{position:relative;z-index:1;display:grid;grid-template-columns:264px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 18px;background:var(--glass);backdrop-filter:blur(22px) saturate(1.5);-webkit-backdrop-filter:blur(22px) saturate(1.5);border-right:1px solid var(--glass-edge);z-index:30}
.brand{display:flex;align-items:center;gap:11px;padding:4px 6px}
.brand-mark{width:38px;height:38px;flex:none}
.brand b{display:block;font-family:var(--f-display);font-size:18px;font-weight:700;letter-spacing:-.02em;line-height:1.1}
.brand small{display:block;font-size:11.5px;color:var(--ink-3)}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;color:var(--ink-2);font-weight:500;transition:background .2s,color .2s}
.nav a:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.nav a.on{background:var(--white);color:var(--ink);box-shadow:0 6px 18px -10px rgba(13,27,42,.3)}
.nav a.on svg{color:var(--lagoon)}
.side-label{padding:0 12px}
.side-groups{display:flex;flex-direction:column;gap:2px}
.side-groups a{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:10px;font-size:14px;color:var(--ink-2)}
.side-groups a:hover{background:rgba(255,255,255,.7);color:var(--ink)}
.side-groups a.on{color:var(--ink);background:rgba(255,255,255,.8)}
.dot{width:9px;height:9px;border-radius:3px;flex:none;background:var(--c)}
.side-groups em{margin-left:auto;font-style:normal;font-family:var(--f-mono);font-size:12px;color:var(--ink-3)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:12px}
.seg{display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:12px;background:rgba(13,27,42,.06)}
.seg button{border:0;background:none;padding:7px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer}
.seg button.on{background:var(--white);color:var(--ink);box-shadow:0 2px 8px -3px rgba(13,27,42,.25)}
.me-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid var(--glass-edge)}
.me-card b{display:block;font-size:13.5px;line-height:1.2}
.me-card small{display:block;font-size:12px;color:var(--ink-3)}

main{min-width:0;padding-block:22px 72px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1220px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.topbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.search{flex:1 1 320px;display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:14px;background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:0 6px 20px -14px rgba(13,27,42,.3);color:var(--ink-3)}
.search input{flex:1;min-width:0;border:0;background:none;font:inherit;color:var(--ink);outline:none}
.search kbd{font-family:var(--f-mono);font-size:11px;padding:2px 7px;border-radius:6px;background:rgba(13,27,42,.06);color:var(--ink-3)}
.pill{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 12px;border-radius:999px;font-size:12.5px;font-weight:500;background:rgba(255,255,255,.75);border:1px solid var(--glass-edge);color:var(--ink-2)}
.pill .pulse{width:7px;height:7px;border-radius:50%;background:var(--mint);box-shadow:0 0 0 0 rgba(31,168,114,.5);animation:pulse 2.4s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(31,168,114,0)}100%{box-shadow:0 0 0 0 rgba(31,168,114,0)}}

.view{display:flex;flex-direction:column;gap:22px;animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:.001;transform:translateY(10px)}}

/* generic */
.glass{background:var(--glass-strong);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border:1px solid var(--glass-edge);box-shadow:var(--shadow)}
.card{border-radius:var(--r-lg);padding:22px;min-width:0;display:flex;flex-direction:column;gap:16px}
.c-head{display:flex;align-items:center;gap:10px;justify-content:space-between;flex-wrap:wrap}
.c-title{display:flex;align-items:center;gap:10px;font-size:16.5px;font-weight:650}
.c-title .ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:color-mix(in srgb,var(--c,var(--lagoon)) 13%,white);color:var(--c,var(--lagoon))}
.c-title .ic svg{width:16px;height:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 16px;border-radius:12px;border:1px solid var(--line-2);background:var(--white);font-size:14px;font-weight:550;color:var(--ink);cursor:pointer;white-space:nowrap;transition:transform .15s,box-shadow .2s,background .2s}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 18px -10px rgba(13,27,42,.35)}
.btn svg{width:16px;height:16px}
.btn-primary{background:linear-gradient(135deg,var(--lagoon),var(--lagoon-deep));color:var(--white);border-color:transparent;box-shadow:0 10px 22px -10px var(--lagoon)}
.btn-primary:hover{box-shadow:0 14px 26px -10px var(--lagoon)}
.btn-ghost{background:rgba(255,255,255,.55)}
.btn-sm{height:32px;padding:0 12px;font-size:13px;border-radius:10px}
.icon-btn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:9px;border:1px solid var(--line);background:var(--white);cursor:pointer;color:var(--ink-2)}
.icon-btn svg{width:15px;height:15px}
.chip{--c:var(--lagoon);display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:550;background:color-mix(in srgb,var(--c) 11%,white);color:color-mix(in srgb,var(--c) 78%,black);border:1px solid color-mix(in srgb,var(--c) 18%,white);white-space:nowrap}
.chip.plain{--c:var(--ink-3);color:var(--ink-2)}
.tag{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:9px;background:var(--white);border:1px solid var(--line);font-size:13px;font-weight:500;color:var(--ink-2);transition:border-color .2s,color .2s,transform .2s}
.tag:hover{border-color:var(--lagoon);color:var(--ink);transform:translateY(-1px)}
.tag.top{background:linear-gradient(135deg,color-mix(in srgb,var(--lagoon) 12%,white),color-mix(in srgb,var(--iris) 10%,white));border-color:color-mix(in srgb,var(--lagoon) 25%,white);color:var(--ink);font-weight:600}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap}
.page-head h1{font-size:clamp(30px,4vw,44px);font-weight:700;line-height:1.05;letter-spacing:-.03em}
.page-head .lede{color:var(--ink-2);max-width:62ch;margin-top:8px}
.actions{display:flex;gap:10px;flex-wrap:wrap}
.muted{color:var(--ink-3)}

/* avatars */
.av{--s:40px;width:var(--s);height:var(--s);border-radius:50%;display:inline-grid;place-items:center;flex:none;background:radial-gradient(circle at 30% 22%,rgba(255,255,255,.5),transparent 46%),linear-gradient(140deg,var(--a1),var(--a2));color:var(--white);font-family:var(--f-display);font-weight:700;font-size:calc(var(--s)*.36);letter-spacing:.01em;box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.55);text-shadow:0 1px 2px rgba(13,27,42,.18)}
.stack{display:flex}
.stack .av{margin-left:-9px;box-shadow:0 0 0 2.5px var(--white)}
.stack .av:first-child{margin-left:0}
.stack .more{--s:32px;width:var(--s);height:var(--s);margin-left:-9px;border-radius:50%;display:grid;place-items:center;background:var(--white);box-shadow:0 0 0 2.5px var(--white),inset 0 0 0 1px var(--line);font-size:11.5px;font-weight:600;color:var(--ink-2)}

/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.kpi{position:relative;overflow:hidden;border-radius:var(--r-lg);padding:20px 20px 18px;display:flex;flex-direction:column;gap:6px}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%)}
.kpi .k-label{font-size:13px;color:var(--ink-2);font-weight:500;display:flex;align-items:center;gap:8px}
.kpi .k-label svg{width:15px;height:15px;color:var(--c)}
.kpi .k-num{font-family:var(--f-display);font-size:38px;font-weight:700;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .k-sub{font-size:12.5px;color:var(--ink-3)}
.delta{display:inline-flex;align-items:center;gap:3px;padding:1px 7px;border-radius:999px;background:color-mix(in srgb,var(--mint) 13%,white);color:color-mix(in srgb,var(--mint) 70%,black);font-weight:600;font-size:12px;margin-right:4px}

/* bento */
.bento{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s6{grid-column:span 6}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}

/* group cards */
.g-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.g-card{position:relative;border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:14px;overflow:hidden;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.g-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-lift)}
.g-card::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 30%,white))}
.g-top{display:flex;gap:14px;align-items:flex-start}
.g-badge{width:46px;height:46px;border-radius:14px;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:15px;color:var(--white);background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.45),transparent 50%),linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 60%,black));box-shadow:0 10px 20px -10px var(--c)}
.g-card h3{font-size:18px;font-weight:650;line-height:1.2}
.g-card .desc{font-size:13.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin-top:3px}
.g-stats{display:flex;gap:22px;flex-wrap:wrap}
.g-stats div{display:flex;flex-direction:column}
.g-stats b{font-family:var(--f-display);font-size:22px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.g-stats span{font-size:12px;color:var(--ink-3)}
.g-foot{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.spark{width:150px;max-width:45%;height:auto}
.stretch{position:absolute;inset:0;z-index:1;border-radius:inherit}
.stretch:focus-visible{outline-offset:-3px}

/* activity */
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.feed li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.feed li:first-child{border-top:0;padding-top:0}
.feed p{font-size:13.5px;color:var(--ink-2);line-height:1.45}
.feed p b{color:var(--ink);font-weight:600}
.feed .obj{display:block;color:var(--ink);font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.feed time{font-size:12px;color:var(--ink-3)}
.feed .kind{position:relative}
.feed .kind i{position:absolute;right:-3px;bottom:-3px;width:17px;height:17px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:var(--white);box-shadow:0 0 0 2px var(--white)}
.feed .kind i svg{width:10px;height:10px}

.todo{display:flex;flex-direction:column;gap:12px}
.todo a{display:grid;grid-template-columns:auto minmax(0,1fr) 110px;align-items:center;gap:12px;padding:6px;border-radius:12px}
.todo a:hover{background:rgba(255,255,255,.7)}
.todo b{font-size:14px;font-weight:600;display:block;line-height:1.2}
.todo small{font-size:12px;color:var(--ink-3)}
.meter{height:7px;border-radius:99px;background:rgba(13,27,42,.07);overflow:hidden}
.meter i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c,var(--lagoon)),color-mix(in srgb,var(--c,var(--lagoon)) 55%,white))}

/* charts */
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .grid{stroke:var(--line);stroke-dasharray:3 5}
.chart .tick{fill:var(--ink-3);font:500 12px var(--f-mono)}
.chart .val{fill:var(--ink-2);font:600 12px var(--f-mono)}
.chart .val.hi{fill:var(--ink)}
.chart .xl{fill:var(--ink-3);font:500 12px var(--f-mono)}
.hbars{display:flex;flex-direction:column;gap:11px}
.hbar{display:grid;grid-template-columns:minmax(0,150px) minmax(0,1fr) 34px;gap:12px;align-items:center;font-size:13.5px}
.hbar span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink-2);font-weight:500}
.hbar .track{height:10px;border-radius:99px;background:rgba(13,27,42,.06);overflow:hidden}
.hbar .track i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--c),color-mix(in srgb,var(--c) 50%,white));transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes grow{from{transform:scaleX(.02)}}
.hbar b{font-family:var(--f-mono);font-size:12.5px;text-align:right;font-variant-numeric:tabular-nums}

/* hero (profile + group) */
.hero{position:relative;border-radius:var(--r-xl);overflow:hidden}
.cover{position:relative;height:210px;overflow:hidden;background:
  radial-gradient(55% 120% at 8% 0%,color-mix(in srgb,var(--c1) 62%,white),transparent 62%),
  radial-gradient(50% 110% at 92% 6%,color-mix(in srgb,var(--c2) 58%,white),transparent 62%),
  radial-gradient(45% 90% at 52% 108%,color-mix(in srgb,var(--saffron) 40%,white),transparent 70%),
  linear-gradient(118deg,color-mix(in srgb,var(--c1) 30%,white),color-mix(in srgb,var(--c2) 30%,white))}
.cover::before{content:"";position:absolute;inset:-60%;background:conic-gradient(from 0deg,transparent 0 30%,rgba(255,255,255,.38) 40%,transparent 52%);animation:spin 26s linear infinite}
@keyframes spin{to{transform:rotate(1turn)}}
.cover canvas{position:absolute;inset:0;width:100%;height:100%}
.cover-mark{position:absolute;right:28px;bottom:14px;font-family:var(--f-display);font-weight:800;font-size:clamp(56px,9vw,112px);line-height:.9;letter-spacing:-.05em;color:rgba(255,255,255,.55);mix-blend-mode:soft-light;pointer-events:none}
.cover-mark small{display:block;font-family:var(--f-mono);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;text-align:right;color:rgba(255,255,255,.9);mix-blend-mode:normal}
.p-id{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:22px;align-items:end;padding:0 28px 26px;margin-top:-70px}
.p-ava{position:relative;width:150px;height:150px;flex:none}
.p-ava .av{position:absolute;inset:14px;width:auto;height:auto;font-size:44px;box-shadow:0 0 0 5px var(--white),0 18px 34px -14px rgba(13,27,42,.45)}
.p-ava svg.ring{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.p-ava .pct{position:absolute;left:50%;bottom:-6px;transform:translateX(-50%);padding:3px 10px;border-radius:999px;background:var(--white);font:600 11.5px var(--f-mono);color:var(--ink);box-shadow:0 6px 14px -6px rgba(13,27,42,.35);white-space:nowrap}
.p-names{min-width:0;display:flex;flex-direction:column;gap:8px;padding-bottom:4px}
.p-names h1{font-size:clamp(30px,4.2vw,46px);font-weight:750;letter-spacing:-.035em;line-height:1.02}
.p-role{font-size:16px;color:var(--ink-2);font-weight:500}
.p-badges{display:flex;gap:6px;flex-wrap:wrap}
.p-contact{display:flex;flex-wrap:wrap;gap:6px 16px;list-style:none;margin:2px 0 0;padding:0;font-size:13.5px;color:var(--ink-2)}
.p-contact li{display:flex;align-items:center;gap:6px}
.p-contact svg{width:14px;height:14px;color:var(--ink-3)}
.p-contact button{border:0;background:none;padding:0;cursor:pointer;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;border-bottom:1px dashed var(--line-2)}
.p-contact button:hover{color:var(--lagoon-deep)}
.p-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;padding-bottom:6px}
.back{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--ink-2);font-weight:500;width:max-content}
.back svg{width:15px;height:15px}
.back:hover{color:var(--ink)}

.stat{border-radius:var(--r-lg);padding:18px 20px;display:flex;flex-direction:column;gap:4px;position:relative;overflow:hidden}
.stat .k-label{font-size:12.5px;color:var(--ink-3);font-weight:500}
.stat b{font-family:var(--f-display);font-size:34px;font-weight:750;letter-spacing:-.035em;line-height:1.05;font-variant-numeric:tabular-nums;background:linear-gradient(120deg,var(--ink),color-mix(in srgb,var(--c) 70%,var(--ink)));-webkit-background-clip:text;background-clip:text;color:transparent}
.stat small{font-size:12px;color:var(--ink-3)}
.stat svg.bg{position:absolute;right:14px;top:14px;width:22px;height:22px;color:var(--c);opacity:.8}

.about p{color:var(--ink-2);font-size:15px;line-height:1.7;max-width:68ch}
.about .facts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.fact{padding:12px 14px;border-radius:var(--r-md);background:rgba(255,255,255,.7);border:1px solid var(--line)}
.fact span{display:block;font-size:11.5px;color:var(--ink-3);font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.fact b{display:block;font-size:14px;font-weight:600;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nudge{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-md);background:linear-gradient(120deg,color-mix(in srgb,var(--saffron) 14%,white),color-mix(in srgb,var(--coral) 9%,white));border:1px solid color-mix(in srgb,var(--saffron) 25%,white);font-size:13.5px}
.nudge b{font-weight:600}
.nudge .btn{margin-left:auto}

.skills{display:flex;flex-direction:column;gap:14px}
.skills .row{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start}
.skills .row > span{padding-top:5px}
.skills .tags{display:flex;flex-wrap:wrap;gap:7px}

.cv{display:grid;grid-template-columns:132px minmax(0,1fr);gap:20px;align-items:center}
.cv-doc{position:relative;aspect-ratio:1/1.32;max-width:100%;border-radius:10px;background:var(--white);box-shadow:0 1px 0 var(--line),0 16px 30px -14px rgba(13,27,42,.35);padding:14px 12px;display:flex;flex-direction:column;gap:6px;transform:rotate(-3deg);transition:transform .35s cubic-bezier(.2,.8,.2,1);cursor:pointer;border:0;text-align:left}
.cv-doc:hover{transform:rotate(0) scale(1.04)}
.cv-doc::after{content:"";position:absolute;inset:6px -6px -6px 6px;border-radius:10px;background:color-mix(in srgb,var(--lagoon) 12%,white);z-index:-1;transform:rotate(5deg)}
.cv-doc i{display:block;height:5px;border-radius:3px;background:rgba(13,27,42,.1)}
.cv-doc i.h{height:9px;width:70%;background:linear-gradient(90deg,var(--lagoon),var(--iris))}
.cv-doc i.s{width:40%;background:rgba(13,27,42,.18)}
.cv-doc em{position:absolute;right:8px;bottom:8px;font:700 9.5px var(--f-mono);font-style:normal;padding:2px 6px;border-radius:5px;background:var(--coral);color:var(--white)}
.cv h4{font-size:16px;font-weight:650;overflow-wrap:anywhere;font-family:var(--f-body)}
.cv .meta{font-size:13px;color:var(--ink-3);margin:4px 0 14px}
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:18px;border:1.5px dashed var(--line-2);border-radius:var(--r-md);color:var(--ink-2);font-size:14px}

.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.timeline::before{content:"";position:absolute;left:15px;top:8px;bottom:8px;width:2px;background:linear-gradient(var(--lagoon),color-mix(in srgb,var(--iris) 40%,white),transparent)}
.timeline li{position:relative;display:grid;grid-template-columns:32px minmax(0,1fr);gap:14px;padding:0 0 20px}
.timeline li:last-child{padding-bottom:0}
.t-dot{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--white);border:2px solid color-mix(in srgb,var(--lagoon) 35%,white);color:var(--lagoon);z-index:1}
.t-dot svg{width:14px;height:14px}
.timeline li.now .t-dot{background:var(--lagoon);border-color:var(--lagoon);color:var(--white);box-shadow:0 0 0 5px color-mix(in srgb,var(--lagoon) 18%,transparent)}
.timeline h4{font-family:var(--f-body);font-size:15px;font-weight:650;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.timeline .org{font-size:13.5px;color:var(--ink-2)}
.timeline .when{font-family:var(--f-mono);font-size:12px;color:var(--ink-3);margin-top:2px}
.timeline .d{font-size:13.5px;color:var(--ink-2);margin-top:6px}

.ach{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.ach-item{display:flex;gap:12px;align-items:flex-start;padding:14px;border-radius:var(--r-md);background:rgba(255,255,255,.75);border:1px solid var(--line);transition:transform .2s,box-shadow .2s}
.ach-item:hover{transform:translateY(-2px);box-shadow:0 12px 24px -16px rgba(13,27,42,.4)}
.ach-ic{width:38px;height:38px;border-radius:11px;flex:none;display:grid;place-items:center;color:var(--white);background:linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 62%,black));box-shadow:0 8px 16px -8px var(--c)}
.ach-ic svg{width:18px;height:18px}
.ach-item b{display:block;font-size:14px;font-weight:600;line-height:1.3}
.ach-item small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:3px}

.tabs{display:flex;gap:4px;padding:4px;border-radius:12px;background:rgba(13,27,42,.05);width:max-content;max-width:100%;overflow-x:auto}
.tabs button{border:0;background:none;padding:7px 13px;border-radius:9px;font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.tabs button.on{background:var(--white);color:var(--ink);box-shadow:0 2px 8px -3px rgba(13,27,42,.25)}
.tabs button em{font-style:normal;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-3);margin-left:5px}
.pubs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.pub{display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:18px;padding:16px 4px;border-top:1px solid var(--line);align-items:start}
.pub:first-child{border-top:0}
.pub.new{animation:flash 1.6s ease}
@keyframes flash{0%,40%{background:color-mix(in srgb,var(--saffron) 16%,white)}100%{background:transparent}}
.pub-year{font-family:var(--f-display);font-size:21px;font-weight:700;letter-spacing:-.02em;color:var(--lagoon-deep);line-height:1.2}
.pub h4{font-family:var(--f-body);font-size:15.5px;font-weight:600;line-height:1.4}
.pub .venue{font-size:13.5px;color:var(--ink-2);margin-top:4px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pub .venue i{font-style:italic}
.authors{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px;font-size:12.5px;color:var(--ink-3);align-items:center}
.authors a{display:inline-flex;align-items:center;gap:5px;padding:2px 8px 2px 2px;border-radius:99px;background:var(--white);border:1px solid var(--line);color:var(--ink-2);font-weight:500;position:relative;z-index:2}
.authors a:hover{border-color:var(--lagoon);color:var(--ink)}
.authors .self{background:color-mix(in srgb,var(--lagoon) 10%,white);border-color:color-mix(in srgb,var(--lagoon) 25%,white);color:var(--ink)}
.pub-side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;text-align:right}
.cites b{font-family:var(--f-display);font-size:20px;font-weight:700;display:block;line-height:1;font-variant-numeric:tabular-nums}
.cites span{font-size:11.5px;color:var(--ink-3)}
.doi{border:0;background:none;padding:0;cursor:pointer;font:500 11.5px var(--f-mono);color:var(--ink-3);display:inline-flex;gap:5px;align-items:center;max-width:180px}
.doi span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.doi svg{width:12px;height:12px;flex:none}
.doi:hover{color:var(--lagoon-deep)}

/* members */
.m-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.m-card{position:relative;border-radius:var(--r-lg);padding:18px;display:flex;flex-direction:column;gap:12px;transition:transform .25s cubic-bezier(.2,.8,.2,1),box-shadow .25s}
.m-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-lift)}
.m-card .who{display:flex;gap:12px;align-items:center}
.m-card h4{font-family:var(--f-body);font-size:15px;font-weight:650;line-height:1.25}
.m-card .t{font-size:12.5px;color:var(--ink-3)}
.m-card .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:10px 0;border-block:1px solid var(--line)}
.m-card .nums div{text-align:center}
.m-card .nums b{display:block;font-family:var(--f-display);font-size:19px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.m-card .nums span{font-size:11px;color:var(--ink-3)}
.m-card .mini{display:flex;flex-wrap:wrap;gap:5px}
.m-card .mini .tag{height:24px;font-size:12px;padding:0 9px}
.m-card .lead{position:absolute;top:14px;right:14px}
.m-remove{position:absolute;top:12px;right:12px;z-index:2;opacity:0;transition:opacity .2s}
.m-card:hover .m-remove,.m-remove:focus-visible{opacity:1}
@media (hover:none){.m-remove{opacity:1}}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.select{height:36px;border-radius:10px;border:1px solid var(--line-2);background:var(--white);padding:0 10px;font:500 13px var(--f-body);color:var(--ink)}

/* directory */
.filters{display:flex;gap:6px;flex-wrap:wrap}
.filters button{border:1px solid var(--line-2);background:rgba(255,255,255,.7);height:32px;padding:0 12px;border-radius:99px;font-size:13px;font-weight:550;color:var(--ink-2);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.filters button.on{background:var(--ink);border-color:var(--ink);color:var(--white)}
.filters .dot{width:8px;height:8px}
.table-wrap{overflow-x:auto;border-radius:var(--r-lg)}
table{width:100%;border-collapse:collapse;min-width:820px;font-size:14px}
th{text-align:left;font:500 11.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);padding:14px 16px;border-bottom:1px solid var(--line)}
td{padding:12px 16px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover{background:rgba(255,255,255,.75)}
tbody tr:last-child td{border-bottom:0}
td .who{display:flex;gap:12px;align-items:center}
td .who b{display:block;font-weight:600;line-height:1.2}
td .who small{color:var(--ink-3);font-size:12.5px}
td .num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-weight:500}
.comp{display:flex;align-items:center;gap:10px;min-width:130px}
.comp .meter{flex:1}
.comp span{font:500 12px var(--f-mono);color:var(--ink-2);width:34px;text-align:right}

/* overlay: modal + drawer */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(13,27,42,.28);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .2s ease both}
@keyframes fade{from{opacity:0}}
.modal{width:min(620px,100%);max-height:100%;overflow:auto;border-radius:var(--r-xl);background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid var(--glass-edge);box-shadow:0 40px 80px -30px rgba(13,27,42,.5);padding:26px;display:flex;flex-direction:column;gap:16px;animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
.modal.wide{width:min(880px,100%)}
@keyframes pop{from{transform:translateY(14px) scale(.98);opacity:0}}
.m-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.m-head h2{font-size:24px;font-weight:700}
.m-head p{color:var(--ink-2);font-size:14px;margin-top:4px}
.overlay.right{justify-content:flex-end;align-items:stretch;padding:0}
.drawer{width:min(470px,100%);height:100%;overflow:auto;background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-left:1px solid var(--glass-edge);box-shadow:-30px 0 60px -30px rgba(13,27,42,.4);display:flex;flex-direction:column;gap:18px;padding-block:max(24px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px));animation:slide .35s cubic-bezier(.2,.8,.2,1) both}
@keyframes slide{from{transform:translateX(40px);opacity:0}}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:var(--ink-2)}
.input,textarea.input{height:42px;border-radius:12px;border:1px solid var(--line-2);background:var(--white);padding:0 13px;font:inherit;font-size:14px;color:var(--ink);width:100%}
textarea.input{height:auto;min-height:130px;padding:11px 13px;resize:vertical;line-height:1.55}
.input:focus{outline:none;border-color:var(--lagoon);box-shadow:0 0 0 4px color-mix(in srgb,var(--lagoon) 16%,transparent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;padding:28px 18px;border-radius:var(--r-lg);border:1.5px dashed color-mix(in srgb,var(--lagoon) 45%,white);background:linear-gradient(140deg,color-mix(in srgb,var(--lagoon) 6%,white),color-mix(in srgb,var(--iris) 6%,white));cursor:pointer;transition:background .2s,border-color .2s}
.drop.over,.drop:hover{border-color:var(--lagoon);background:color-mix(in srgb,var(--lagoon) 12%,white)}
.drop .big{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--white);color:var(--lagoon);box-shadow:0 10px 20px -12px rgba(13,27,42,.4)}
.drop .big svg{width:22px;height:22px}
.drop b{font-size:15px}
.drop small{font-size:12.5px;color:var(--ink-3)}
.pick-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;max-height:340px;overflow:auto}
.pick-list li{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid var(--line)}
.pick-list b{display:block;font-size:14px;font-weight:600;line-height:1.25}
.pick-list small{display:block;font-size:12.5px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hint{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--ink-2);padding:12px 14px;border-radius:var(--r-md);background:color-mix(in srgb,var(--iris) 7%,white);border:1px solid color-mix(in srgb,var(--iris) 15%,white)}
.hint svg{width:16px;height:16px;flex:none;color:var(--iris);margin-top:2px}
.swatches{display:flex;gap:10px}
.swatches label{cursor:pointer}
.swatches input{position:absolute;opacity:0}
.swatches span{display:block;width:34px;height:34px;border-radius:11px;background:var(--c);box-shadow:inset 0 0 0 3px rgba(255,255,255,.6)}
.swatches input:checked + span{box-shadow:0 0 0 3px var(--white),0 0 0 5px var(--c)}
.swatches input:focus-visible + span{outline:2px solid var(--ink);outline-offset:4px}

/* CV paper */
.paper{background:var(--white);border-radius:6px;box-shadow:0 30px 60px -30px rgba(13,27,42,.45),0 0 0 1px var(--line);padding:clamp(22px,5vw,48px);display:flex;flex-direction:column;gap:20px;color:var(--ink)}
.paper header{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;padding-bottom:16px;border-bottom:2px solid var(--ink)}
.paper header h2{font-size:30px;font-weight:750;letter-spacing:-.03em}
.paper header p{color:var(--ink-2);font-size:14px}
.paper .ct{font:500 12px var(--f-mono);color:var(--ink-2);text-align:right;display:flex;flex-direction:column;gap:2px}
.paper h5{font:600 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--lagoon-deep);margin-bottom:8px}
.paper section > p{font-size:13.5px;line-height:1.65;color:var(--ink-2)}
.paper .ln{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;font-size:13.5px;padding:4px 0}
.paper .ln span{font:500 12px var(--f-mono);color:var(--ink-3);padding-top:2px}
.paper .ln b{font-weight:600}
.paper .ln i{color:var(--ink-2)}

/* toast */
.toasts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}
.toast{display:flex;align-items:center;gap:10px;padding:11px 16px;border-radius:14px;background:var(--ink);color:var(--white);font-size:13.5px;font-weight:500;box-shadow:0 18px 36px -14px rgba(13,27,42,.6);animation:pop .3s cubic-bezier(.2,.8,.2,1) both}
.toast svg{width:16px;height:16px;color:#5FE3C0;flex:none}

/* ===== portraits ===== */
.av{background:linear-gradient(140deg,color-mix(in srgb,var(--a1) 40%,white),color-mix(in srgb,var(--a2) 40%,white));overflow:hidden}
.av img{width:100%;height:100%;display:block;object-fit:cover}

/* ===== 3D profile hero ===== */
.phero{position:relative;border-radius:32px;overflow:hidden;isolation:isolate;border:1px solid var(--glass-edge);box-shadow:var(--shadow-lift);background:
  radial-gradient(50% 80% at 12% 10%,color-mix(in srgb,var(--c1) 55%,white),transparent 65%),
  radial-gradient(45% 70% at 70% 0%,color-mix(in srgb,var(--c2) 40%,white),transparent 65%),
  radial-gradient(40% 70% at 30% 100%,color-mix(in srgb,var(--saffron) 35%,white),transparent 70%),
  linear-gradient(120deg,color-mix(in srgb,var(--c1) 22%,white),var(--white) 60%,color-mix(in srgb,var(--c2) 14%,white))}
.phero::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 30%,rgba(255,255,255,.4) 40%,transparent 52%);animation:spin 30s linear infinite;z-index:0}
.phero>canvas{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.phero::after{content:"";position:absolute;inset:0;z-index:0;pointer-events:none;background:linear-gradient(100deg,transparent 38%,rgba(255,255,255,.5) 62%,rgba(255,255,255,.72))}
.ph-objs{position:absolute;inset:0;z-index:1;pointer-events:none}
.obj{position:absolute;transform:translate(calc(var(--mx,0)*var(--dx)),calc(var(--my,0)*var(--dy)));transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.obj-p{perspective:500px}
.cube{position:relative;width:64px;height:64px;transform-style:preserve-3d;animation:cube 22s linear infinite}
.cube i{position:absolute;inset:0;border-radius:14px;background:linear-gradient(135deg,rgba(255,255,255,.85),color-mix(in srgb,var(--c2) 28%,transparent));border:1.5px solid rgba(255,255,255,.95);box-shadow:inset 0 0 18px rgba(255,255,255,.6)}
.cube i:nth-child(1){transform:translateZ(32px)}.cube i:nth-child(2){transform:rotateY(180deg) translateZ(32px)}.cube i:nth-child(3){transform:rotateY(90deg) translateZ(32px)}.cube i:nth-child(4){transform:rotateY(-90deg) translateZ(32px)}.cube i:nth-child(5){transform:rotateX(90deg) translateZ(32px)}.cube i:nth-child(6){transform:rotateX(-90deg) translateZ(32px)}
@keyframes cube{from{transform:rotateX(-20deg) rotateY(0)}to{transform:rotateX(340deg) rotateY(720deg)}}
.gyro{position:relative;width:130px;height:130px;transform-style:preserve-3d;animation:gyro 16s linear infinite}
.gyro i{position:absolute;inset:0;border-radius:50%;border:2px solid rgba(255,255,255,.9);box-shadow:0 0 16px rgba(255,255,255,.55),inset 0 0 12px rgba(255,255,255,.35)}
.gyro i:nth-child(2){transform:rotateY(60deg)}.gyro i:nth-child(3){transform:rotateY(120deg)}
@keyframes gyro{from{transform:rotateX(65deg) rotateZ(0)}to{transform:rotateX(65deg) rotateZ(360deg) rotateY(360deg)}}
.orb{display:block;width:var(--sz);height:var(--sz);border-radius:50%;background:radial-gradient(circle at 32% 28%,var(--white),color-mix(in srgb,var(--c) 55%,white) 32%,var(--c) 78%);box-shadow:0 18px 30px -12px var(--c);animation:bob 8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-14px)}}
.ph-grid{position:relative;z-index:2;display:grid;grid-template-columns:minmax(0,430px) minmax(0,1fr);gap:24px 36px;align-items:center;padding:30px 44px 38px 28px}
.stage{position:relative;height:470px;perspective:1100px;display:grid;place-items:center}
.card-in{position:relative;z-index:5;transform-style:preserve-3d;animation:cardIn 1.4s cubic-bezier(.2,.8,.2,1) .1s backwards}
@keyframes cardIn{from{opacity:0;transform:translateZ(-320px) rotateY(-75deg) rotateX(18deg)}}
.floaty{transform-style:preserve-3d;animation:bob 7s ease-in-out infinite}
.idcard{position:relative;width:258px;height:372px;border-radius:26px;padding:12px;transform-style:preserve-3d;background:linear-gradient(160deg,rgba(255,255,255,.97),rgba(255,255,255,.84));box-shadow:0 50px 80px -34px rgba(13,27,42,.5),inset 0 0 0 1px rgba(255,255,255,.95),0 0 0 1px rgba(13,27,42,.05);will-change:transform}
.id-photo{position:relative;display:block;height:250px;border-radius:18px;overflow:hidden;transform:translateZ(30px);background:radial-gradient(circle at 28% 18%,rgba(255,255,255,.75),transparent 45%),linear-gradient(155deg,color-mix(in srgb,var(--c1) 72%,white),color-mix(in srgb,var(--c2) 68%,white))}
.id-photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:1}
.halo{position:absolute;left:50%;top:44%;width:220px;height:220px;margin:-110px;border-radius:50%;background:conic-gradient(from 0deg,transparent,rgba(255,255,255,.85),transparent 35%,transparent 60%,rgba(255,255,255,.6),transparent 85%);animation:spin 9s linear infinite;z-index:0}
.id-tag{position:absolute;left:10px;top:10px;z-index:2;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.88);font:600 11px var(--f-mono);letter-spacing:.06em;color:var(--ink)}
.id-cam{position:absolute;right:10px;bottom:10px;z-index:2;width:36px;height:36px;border-radius:50%;border:0;background:var(--white);display:grid;place-items:center;cursor:pointer;box-shadow:0 6px 14px -6px rgba(13,27,42,.5);color:var(--ink)}
.id-cam svg{width:15px;height:15px}
.id-ring{position:absolute;right:-20px;top:150px;width:68px;height:68px;border-radius:50%;background:var(--white);box-shadow:0 16px 28px -10px rgba(13,27,42,.45);transform:translateZ(72px);display:grid;place-items:center}
.id-ring svg{position:absolute;inset:6px;width:calc(100% - 12px);height:calc(100% - 12px)}
.id-ring b{font:750 16px var(--f-display);font-variant-numeric:tabular-nums}
.id-ring small{font-size:10px}
.id-strip{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 6px 6px;transform:translateZ(46px)}
.id-strip .t{min-width:0}
.id-strip .t b{display:block;font-family:var(--f-display);font-size:17px;font-weight:700;letter-spacing:-.02em;line-height:1.15;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.id-strip .t span{display:block;font-size:12.5px;color:var(--ink-3)}
.id-uni{flex:none;width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:linear-gradient(140deg,var(--lagoon),var(--iris));color:var(--white);font:800 12px var(--f-display)}
.id-foot{display:flex;justify-content:space-between;padding:4px 6px 0;font-size:10px;letter-spacing:.12em;color:var(--ink-3);transform:translateZ(18px)}
.id-sheen{position:absolute;inset:0;border-radius:inherit;pointer-events:none;transform:translateZ(1px);background:linear-gradient(115deg,transparent 25%,rgba(255,255,255,.55) var(--sx,45%),transparent 65%),linear-gradient(125deg,rgba(242,97,76,.12),rgba(88,100,236,.12),rgba(12,154,166,.12),rgba(238,155,18,.12));background-size:100% 100%,300% 300%;background-position:0 0,var(--gx,50%) var(--gy,50%)}
.stage-shadow{position:absolute;left:50%;bottom:4px;width:220px;height:30px;margin-left:-110px;border-radius:50%;background:radial-gradient(closest-side,rgba(13,27,42,.3),transparent);filter:blur(4px);animation:shadow 7s ease-in-out infinite;z-index:0}
@keyframes shadow{50%{transform:scale(.82);opacity:.6}}
.orbit{position:absolute;inset:0;pointer-events:none}
.oc{position:absolute;left:50%;top:50%;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.93);border:1px solid var(--glass-edge);box-shadow:0 14px 26px -14px rgba(13,27,42,.45);font-size:13px;font-weight:600;white-space:nowrap;color:var(--ink);will-change:transform,opacity}
.oc svg{width:15px;height:15px;color:var(--lagoon)}
.ph-info{display:flex;flex-direction:column;gap:14px;min-width:0}
.ph-name{font-size:clamp(38px,5.4vw,66px);font-weight:800;letter-spacing:-.045em;line-height:.98;perspective:700px}
.ph-name .w{display:inline-block;white-space:nowrap}
.ph-name .ch{display:inline-block;transform-origin:50% 100%;animation:chIn .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*34ms + .3s)}
@keyframes chIn{from{opacity:0;transform:translateY(.5em) rotateX(-95deg);filter:blur(6px)}}
.ph-role{font-size:17px;font-weight:550;color:var(--ink-2)}
.ph-bio{font-size:15.5px;line-height:1.65;color:var(--ink-2);max-width:60ch}
.ph-facts{display:flex;flex-wrap:wrap;gap:8px}
.ph-facts span{padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.72);border:1px solid var(--glass-edge);font-size:13px;color:var(--ink-2)}
.ph-facts b{color:var(--ink);font-weight:650}
.enter{animation:enter .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:var(--d,0s)}
@keyframes enter{from{opacity:0;transform:translateY(16px)}}

/* ===== stat tiles ===== */
.stat2{position:relative;height:100%;border-radius:var(--r-lg);padding:18px 20px 20px;display:flex;flex-direction:column;gap:4px;overflow:hidden}
.stat2::before{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,var(--c),transparent)}
.st-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.st-top .k-label{font-size:13px;color:var(--ink-2);font-weight:550}
.stat2 .spark{width:92px;max-width:50%}
.gauge{width:52px;height:52px;flex:none}
.stat2 b{font-family:var(--f-display);font-size:40px;font-weight:800;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;color:var(--ink)}
.stat2 small{font-size:12.5px;color:var(--ink-3)}
.tilt{transition:transform .3s cubic-bezier(.2,.8,.2,1),box-shadow .3s}
.tilt::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(circle at var(--gx,50%) var(--gy,0%),rgba(255,255,255,.75),transparent 50%);opacity:0;transition:opacity .3s}
.tilt:hover{box-shadow:var(--shadow-lift)}
.tilt:hover::after{opacity:1}

/* ===== moving charts ===== */
.combo .bar{transform-box:fill-box;transform-origin:50% 100%;animation:barUp .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*70ms + .15s)}
@keyframes barUp{from{transform:scaleY(0)}}
.slot:hover .bar{filter:brightness(1.12) saturate(1.2)}
.ln,.sl{stroke-dasharray:1;animation:draw 1.8s cubic-bezier(.45,0,.2,1) .4s backwards}
@keyframes draw{from{stroke-dashoffset:1}}
.area{animation:fadeIn 1.2s .8s backwards}
@keyframes fadeIn{from{opacity:0}}
.pt{transform-box:fill-box;transform-origin:center;animation:popIn .5s cubic-bezier(.3,1.6,.5,1) backwards;animation-delay:calc(var(--i,0)*90ms + .9s)}
@keyframes popIn{from{transform:scale(0)}}
.pulse-ring{transform-box:fill-box;transform-origin:center;opacity:0;animation:ring 2.2s ease-out 2.2s infinite}
@keyframes ring{0%{transform:scale(1);opacity:.8}100%{transform:scale(3.2);opacity:0}}
.arc{animation:arc 1.5s cubic-bezier(.2,.8,.2,1) .35s backwards}
.arc.a2{animation-delay:.8s}
@keyframes arc{from{stroke-dasharray:0 100}}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;background:var(--c)}
.legend i.line{height:3px;width:16px;border-radius:2px}
.donut{display:flex;align-items:center;gap:18px}
.dn{width:128px;height:128px;flex:none}
.dn-n{font:800 28px var(--f-display);fill:var(--ink)}
.dn-l{font:500 11px var(--f-mono);fill:var(--ink-3)}
.dl{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:13.5px;color:var(--ink-2);flex:1;min-width:0}
.dl li{display:flex;align-items:center;gap:8px}
.dl i{width:10px;height:10px;border-radius:3px;background:var(--c);flex:none}
.dl b{margin-left:auto;padding-left:12px;font-family:var(--f-mono);color:var(--ink)}
.cbar{display:block;width:90px;height:4px;border-radius:4px;background:rgba(13,27,42,.07);overflow:hidden}
.cbar i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--lagoon),var(--iris))}

/* ===== skill sphere ===== */
.sphere{position:relative;height:340px;border-radius:20px;overflow:hidden;perspective:800px;background:radial-gradient(circle at 50% 50%,color-mix(in srgb,var(--lagoon) 12%,white),rgba(255,255,255,.35) 55%,transparent 75%);touch-action:pan-y}
.rings{position:absolute;inset:0;transform-style:preserve-3d;pointer-events:none}
.rings i{position:absolute;left:50%;top:50%;width:280px;height:280px;margin:-140px;border-radius:50%;border:1px dashed color-mix(in srgb,var(--lagoon) 32%,transparent);animation:ringSpin 24s linear infinite}
.rings i:nth-child(1){--r:72deg}.rings i:nth-child(2){--r:20deg;animation-duration:30s;animation-direction:reverse}.rings i:nth-child(3){--r:-55deg;width:200px;height:200px;margin:-100px;animation-duration:18s}
@keyframes ringSpin{from{transform:rotateX(var(--r)) rotateZ(0)}to{transform:rotateX(var(--r)) rotateZ(360deg)}}
.st{position:absolute;left:50%;top:50%;padding:6px 12px;border-radius:999px;background:var(--white);border:1px solid color-mix(in srgb,var(--c) 28%,white);color:color-mix(in srgb,var(--c) 75%,black);font-size:13.5px;font-weight:600;white-space:nowrap;box-shadow:0 10px 20px -12px var(--c);will-change:transform,opacity}
.st.big{font-size:15.5px;padding:8px 15px;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,var(--iris)));color:var(--white);border-color:transparent}

/* ===== CV stack ===== */
.cv2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:center}
.cvstack{position:relative;height:236px;display:grid;place-items:center;border:0;background:none;cursor:pointer;perspective:900px;padding:0}
.sheet{position:absolute;width:140px;height:186px;border-radius:10px;background:var(--white);box-shadow:0 1px 0 var(--line),0 20px 34px -18px rgba(13,27,42,.45);padding:14px 12px;display:flex;flex-direction:column;gap:6px;transition:transform .7s cubic-bezier(.2,.8,.2,1);animation:sheetIn .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*.14s + .2s)}
.sheet i{display:block;height:5px;border-radius:3px;background:rgba(13,27,42,.09)}
.sheet i.h{height:9px;width:70%;background:linear-gradient(90deg,var(--lagoon),var(--iris))}
.sheet i.s{width:40%;background:rgba(13,27,42,.18)}
.sheet em{position:absolute;right:8px;bottom:8px;font:700 9.5px var(--f-mono);font-style:normal;padding:2px 6px;border-radius:5px;background:var(--coral);color:var(--white)}
.sheet:nth-child(1){transform:rotate(-9deg) translate(-16px,8px);background:color-mix(in srgb,var(--iris) 9%,white)}
.sheet:nth-child(2){transform:rotate(6deg) translate(16px,4px);background:color-mix(in srgb,var(--lagoon) 9%,white)}
.sheet:nth-child(3){transform:rotate(-1deg)}
.cvstack:hover .sheet:nth-child(1),.cvstack:focus-visible .sheet:nth-child(1){transform:rotate(-20deg) translate(-60px,14px)}
.cvstack:hover .sheet:nth-child(2),.cvstack:focus-visible .sheet:nth-child(2){transform:rotate(16deg) translate(60px,10px)}
.cvstack:hover .sheet:nth-child(3),.cvstack:focus-visible .sheet:nth-child(3){transform:translateY(-14px) rotateX(12deg) scale(1.06)}
@keyframes sheetIn{from{opacity:0;transform:translateY(70px) rotate(0)}}
.cv-meta{min-width:0}
.cv-meta h4{font-family:var(--f-body);font-size:16px;font-weight:650;overflow-wrap:anywhere}
.cv-meta .meta{font-size:12.5px;color:var(--ink-3);margin:6px 0 14px;line-height:1.6}

/* ===== timeline motion ===== */
.timeline::before{transform-origin:top;animation:lineDown 1.3s .15s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes lineDown{from{transform:scaleY(0)}}
.timeline li{animation:slideIn .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*.14s + .35s)}
@keyframes slideIn{from{opacity:0;transform:translateX(24px)}}
.dur{display:block;height:5px;width:var(--w);max-width:100%;border-radius:5px;margin-top:8px;background:linear-gradient(90deg,var(--lagoon),color-mix(in srgb,var(--iris) 60%,white));transform-origin:left;animation:grow 1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*.14s + .6s)}

/* ===== flip achievements ===== */
.flips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.flip{position:relative;height:188px;perspective:1000px;cursor:pointer;border-radius:18px}
.flip-in{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.2,.8,.2,1)}
@media (hover:hover){.flip:hover .flip-in{transform:rotateY(180deg)}}
.flip:focus-visible .flip-in,.flip.on .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.face.front{background:var(--white);border:1px solid var(--line);box-shadow:0 14px 28px -20px rgba(13,27,42,.45)}
.face.front b{font-size:14.5px;font-weight:650;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.face .yr{position:absolute;right:14px;top:14px;font-size:12px;color:var(--ink-3)}
.flip-hint{margin-top:auto;font-size:11.5px;color:var(--ink-3);display:inline-flex;align-items:center;gap:4px}
.flip-hint svg{width:12px;height:12px}
.face.back{transform:rotateY(180deg);justify-content:flex-end;color:var(--white);background:radial-gradient(circle at 80% 0%,rgba(255,255,255,.35),transparent 50%),linear-gradient(150deg,var(--c),color-mix(in srgb,var(--c) 55%,var(--ink)))}
.face.back b{font-family:var(--f-display);font-size:18px;color:var(--white);line-height:1.2}
.face.back p{font-size:13px;color:rgba(255,255,255,.9)}
.medal-in{width:max-content;animation:medalIn 1.1s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*.15s + .3s)}
@keyframes medalIn{from{opacity:0;transform:perspective(400px) rotateY(-540deg) scale(.4)}}
.medal{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;color:var(--white);background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.75),transparent 38%),conic-gradient(from 210deg,var(--c),color-mix(in srgb,var(--c) 45%,white),var(--c),color-mix(in srgb,var(--c) 60%,black),var(--c));box-shadow:0 10px 20px -8px var(--c),inset 0 0 0 3px rgba(255,255,255,.35);animation:coin 5s ease-in-out infinite}
.medal svg{width:22px;height:22px}
@keyframes coin{0%,70%,100%{transform:perspective(300px) rotateY(0)}85%{transform:perspective(300px) rotateY(180deg)}}

/* ===== publications motion ===== */
.pub{transition:background .2s,transform .25s}
.pub:hover{background:rgba(255,255,255,.6);transform:translateX(4px)}
.pubs .pub{animation:pubIn .7s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(min(var(--i,0),14)*55ms + .1s)}
@keyframes pubIn{from{opacity:0;transform:translateX(-18px)}}
.pubs .pub.new{animation:flash 1.6s ease}

/* ===== scroll reveal (armed only when motion is allowed) ===== */
.motion .rv{transition:opacity .9s cubic-bezier(.2,.8,.2,1),transform 1.1s cubic-bezier(.2,.8,.2,1)}
.motion .rv:not(.in){opacity:0;transform:perspective(1200px) translateY(46px) rotateX(12deg) scale(.97)}
.motion .rv:not(.in) :is(.bar,.pt,.pub,.timeline li,.sheet,.medal-in,.dur,.track i,.area,.ln,.sl,.arc){animation:none}
.motion .rv:not(.in) .timeline::before{animation:none}
.instant .rv{transition:none!important}
.instant :is(.bar,.pt,.pub,.timeline li,.sheet,.medal-in,.dur,.track i,.area,.ln,.sl,.arc,.ch,.enter,.card-in){animation:none!important}
.instant .timeline::before{animation:none!important}
.instant .pubs .pub.new{animation:flash 1.6s ease!important}

/* ===== career journey ===== */
.ribbon{position:relative;padding:8px 6px 0}
.rb-track{position:relative}
.rb-seg{position:absolute;height:32px;border-radius:10px;display:flex;align-items:center;padding:0 10px;overflow:hidden;color:var(--white);font-size:12px;font-weight:600;white-space:nowrap;background:linear-gradient(90deg,var(--lagoon),color-mix(in srgb,var(--lagoon) 70%,var(--iris)));box-shadow:0 10px 18px -12px var(--lagoon);transform-origin:left;animation:grow .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*.22s + .3s)}
.rb-seg span{position:relative;overflow:hidden;text-overflow:ellipsis}
.rb-seg i{position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.38) 50%,transparent 70%);transform:translateX(-100%);animation:sheenX 4s ease-in-out infinite;animation-delay:calc(var(--i)*.4s + 1.6s)}
@keyframes sheenX{0%,55%{transform:translateX(-100%)}100%{transform:translateX(100%)}}
.rb-seg.edu{background:linear-gradient(90deg,var(--iris),color-mix(in srgb,var(--iris) 70%,var(--coral)));box-shadow:0 10px 18px -12px var(--iris)}
.rb-seg.now{background:linear-gradient(90deg,var(--lagoon),var(--mint));box-shadow:0 10px 22px -10px var(--mint)}
.rb-axis{position:relative;height:30px;margin-top:8px;border-top:2px solid var(--line-2)}
.rb-axis span{position:absolute;top:8px;transform:translateX(-50%);font:500 11.5px var(--f-mono);color:var(--ink-3)}
.rb-axis span:first-child{transform:none}
.rb-axis .nowtag{transform:translateX(-100%);color:var(--coral);font-weight:700}
.rb-axis .rb-dot{top:-7px;left:100%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--coral);transform:none;box-shadow:0 0 0 5px color-mix(in srgb,var(--coral) 22%,transparent);animation:travel 2.4s cubic-bezier(.45,0,.2,1) .3s backwards,dotPulse 2s ease-out 3s infinite}
@keyframes travel{from{left:0}}
@keyframes dotPulse{50%{box-shadow:0 0 0 11px color-mix(in srgb,var(--coral) 0%,transparent)}}
.xp{list-style:none;margin:6px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:14px}
.xp-card{position:relative;display:flex;flex-direction:column;gap:7px;padding:20px 18px 18px;border-radius:20px;background:var(--white);border:1px solid var(--line);box-shadow:0 18px 30px -22px rgba(13,27,42,.45);animation:cardRise .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*.14s + .7s)}
.xp-card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--lagoon)}
.xp-card.edu::before{background:var(--iris)}
.xp-card.now{border:1.5px solid transparent;background:linear-gradient(var(--white),var(--white)) padding-box,linear-gradient(135deg,var(--lagoon),var(--mint),var(--iris)) border-box;box-shadow:0 26px 40px -24px color-mix(in srgb,var(--lagoon) 70%,transparent)}
.xp-card.now::before{background:linear-gradient(90deg,var(--lagoon),var(--mint))}
.xp-top{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.xp-mono{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:800 15px var(--f-display);color:var(--white);background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.45),transparent 50%),linear-gradient(140deg,var(--lagoon),var(--lagoon-deep));box-shadow:0 10px 18px -10px var(--lagoon)}
.xp-card.edu .xp-mono{background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.45),transparent 50%),linear-gradient(140deg,var(--iris),color-mix(in srgb,var(--iris) 60%,black));box-shadow:0 10px 18px -10px var(--iris)}
.xp-yrs{text-align:right;line-height:1.05}
.xp-yrs b{display:block;font:800 26px var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.xp-yrs span{font:500 12px var(--f-mono);color:var(--ink-3)}
.xp-yrs span::before{content:"to "}
.xp-card h4{font:650 15.5px/1.3 var(--f-body)}
.xp-card .org{font-size:13.5px;color:var(--ink-2)}
.xp-card .d{font-size:13px;color:var(--ink-2);line-height:1.55}
.xp-cur{align-self:flex-start;margin-top:auto}
.xp-cur .pulse{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:pulse 2.4s infinite}
@keyframes cardRise{from{opacity:0;transform:perspective(600px) translateY(30px) rotateX(14deg)}}

/* ===== publication cover cards ===== */
.pc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:16px}
.pcard{position:relative;border-radius:20px;overflow:hidden;display:flex;flex-direction:column;animation:cardRise .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*90ms + .1s)}
.pc-cover{position:relative;height:132px;padding:14px 16px;display:flex;flex-direction:column;justify-content:space-between;color:var(--white);overflow:hidden;background:radial-gradient(circle at 85% 10%,rgba(255,255,255,.42),transparent 45%),repeating-linear-gradient(135deg,rgba(255,255,255,.08) 0 2px,transparent 2px 12px),linear-gradient(140deg,var(--c),color-mix(in srgb,var(--c) 55%,var(--ink)))}
.pc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;position:relative;z-index:1}
.pc-venue{font:700 15px/1.2 var(--f-display);letter-spacing:-.01em;max-width:72%}
.pc-type{flex:none;padding:3px 9px;border-radius:99px;font-size:11.5px;font-weight:600;background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4)}
.pc-cite{position:relative;z-index:1;font-size:12px;color:rgba(255,255,255,.9)}
.pc-cite b{font:750 20px var(--f-display);color:var(--white);margin-right:3px}
.pc-year{position:absolute;right:-4px;bottom:-20px;font:800 78px/1 var(--f-display);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.5px rgba(255,255,255,.55);transition:transform .5s cubic-bezier(.2,.8,.2,1)}
.pcard:hover .pc-year{transform:translate(-8px,-6px) scale(1.06)}
.pc-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:12px;flex:1}
.pc-body h4{font:600 15px/1.4 var(--f-body);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.pc-auth{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink-3);min-width:0}
.pc-auth > span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.pc-stack{display:flex;flex:none;position:relative;z-index:2}
.pc-stack a{margin-left:-8px;border-radius:50%;box-shadow:0 0 0 2.5px var(--white);transition:transform .2s}
.pc-stack a:first-child{margin-left:0}
.pc-stack a:hover{transform:translateY(-3px);z-index:2}
.pc-stack .av{display:grid}
.pc-foot{margin-top:auto;display:flex;align-items:center;gap:12px}
.pc-foot .doi{flex:none}

/* ===== group hero + network ===== */
.ghero::after{background:linear-gradient(260deg,transparent 45%,rgba(255,255,255,.5) 68%,rgba(255,255,255,.72))}
.gh-grid{grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);padding:34px 24px 30px 44px}
.gh-badge{display:flex;align-items:center;gap:12px}
.gh-badge .g-badge{width:54px;height:54px;border-radius:16px;font-size:17px}
.gh-name{font-size:clamp(34px,4.6vw,58px)}
.gh-lead{display:inline-flex;align-items:center;gap:10px;padding:6px 16px 6px 6px;border-radius:999px;background:rgba(255,255,255,.78);border:1px solid var(--glass-edge);width:max-content;max-width:100%;box-shadow:0 10px 20px -16px rgba(13,27,42,.5)}
.gh-lead small{display:block;font-size:11.5px;color:var(--ink-3)}
.gh-lead b{display:block;font-size:14px;font-weight:650;line-height:1.2}
.gh-lead:hover{background:var(--white)}
.net{position:relative;height:520px;min-width:0}
.net canvas{width:100%;height:100%;display:block;cursor:grab;touch-action:pan-y}
.net-tip{position:absolute;left:0;top:0;z-index:3;transform:translate(-50%,-100%);display:flex;flex-direction:column;gap:2px;padding:9px 13px;border-radius:12px;background:var(--white);box-shadow:0 16px 30px -14px rgba(13,27,42,.5);font-size:12.5px;color:var(--ink-2);white-space:nowrap;pointer-events:none;opacity:0;transition:opacity .15s}
.net-tip b{font-size:14px;color:var(--ink)}
.net-tip.on{opacity:1}
.net-legend{position:absolute;left:0;right:0;bottom:4px;display:flex;justify-content:center;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);pointer-events:none}
.net-legend span{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;background:rgba(255,255,255,.7)}
.lk{display:inline-block;width:18px;height:3px;border-radius:2px;background:var(--c1)}
.lk.hub{height:0;background:none;border-top:2px dashed var(--c1)}
.m-grid .m-card{animation:cardRise .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(min(var(--i,0),12)*70ms + .1s)}

.motion .rv:not(.in) :is(.rb-seg,.rb-dot,.xp-card,.pcard,.m-card){animation:none}
.instant :is(.rb-seg,.rb-dot,.xp-card,.pcard,.m-card){animation:none!important}

/* ===== overview ===== */
.ov-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:34px 24px 30px 44px}
.ov-name{font-size:clamp(34px,4.6vw,58px)}
.ov-pulse{display:flex;gap:10px;flex-wrap:wrap}
.ov-pulse a{display:flex;flex-direction:column;padding:10px 16px;border-radius:16px;background:rgba(255,255,255,.78);border:1px solid var(--glass-edge);box-shadow:0 12px 24px -18px rgba(13,27,42,.5);transition:transform .2s,box-shadow .2s}
.ov-pulse a:hover{transform:translateY(-3px);box-shadow:0 18px 28px -16px rgba(13,27,42,.5)}
.ov-pulse b{font:800 24px/1.1 var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.ov-pulse span{font-size:12px;color:var(--ink-3)}
.galaxy{position:relative;height:450px;min-width:0}
.gx-ring{position:absolute;left:50%;top:50%;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.gx-ring.r1{width:72%;height:54%;border:1.5px dashed color-mix(in srgb,var(--ink) 16%,transparent)}
.gx-ring.r2{width:46%;height:32%;border:1.5px solid rgba(255,255,255,.9);box-shadow:0 0 30px rgba(255,255,255,.6)}
.gx-core{position:absolute;left:50%;top:50%;z-index:5;width:118px;height:118px;margin:-59px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--white);background:radial-gradient(circle at 32% 26%,var(--white),color-mix(in srgb,var(--lagoon) 45%,white) 40%,var(--lagoon) 78%,var(--lagoon-deep));box-shadow:0 30px 50px -20px var(--lagoon),inset 0 0 0 4px rgba(255,255,255,.45);animation:corePulse 4s ease-in-out infinite}
.gx-core b{font:800 16px var(--f-display);letter-spacing:-.01em;text-shadow:0 1px 3px rgba(13,27,42,.25)}
.gx-core small{font-size:11px;opacity:.95}
@keyframes corePulse{50%{box-shadow:0 30px 60px -16px var(--lagoon),0 0 0 16px color-mix(in srgb,var(--lagoon) 12%,transparent),inset 0 0 0 4px rgba(255,255,255,.45)}}
.planet{position:absolute;left:50%;top:50%;width:62px;height:62px;transform-origin:31px 31px;will-change:transform,opacity}
.pl-orb{position:relative;display:grid;place-items:center;width:62px;height:62px;border-radius:50%;font:800 16px var(--f-display);color:var(--white);background:radial-gradient(circle at 32% 26%,rgba(255,255,255,.85),color-mix(in srgb,var(--c) 70%,white) 30%,var(--c) 70%,color-mix(in srgb,var(--c) 60%,black));box-shadow:0 18px 30px -12px var(--c);animation:popIn .7s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i)*.15s + .4s);transition:box-shadow .2s}
.planet:hover .pl-orb,.planet:focus-visible .pl-orb{box-shadow:0 0 0 6px color-mix(in srgb,var(--c) 25%,transparent),0 18px 30px -12px var(--c)}
.pl-moons{position:absolute;left:31px;top:31px;width:0;height:0;animation:spin 12s linear infinite}
.moon{position:absolute;left:0;top:0;transform:rotate(var(--a)) translateX(46px) rotate(calc(-1 * var(--a)))}
.moon .av{position:absolute;left:-11px;top:-11px;box-shadow:0 0 0 2px var(--white);animation:spin 12s linear infinite reverse}
.pl-label{position:absolute;left:31px;top:76px;transform:translateX(-50%);padding:6px 11px;border-radius:12px;background:rgba(255,255,255,.88);border:1px solid var(--glass-edge);box-shadow:0 10px 20px -14px rgba(13,27,42,.5);text-align:center;white-space:nowrap;color:var(--ink)}
.pl-label b{display:block;font-size:12.5px;font-weight:650}
.pl-label small{display:block;font-size:11px;color:var(--ink-3)}
.gx-hint{position:absolute;left:0;right:0;bottom:4px;text-align:center;font-size:12px;color:var(--ink-3)}
.gdots{display:flex;gap:4px;padding-top:6px}
.gdots i{width:12px;height:12px;border-radius:4px;background:var(--c);box-shadow:0 4px 8px -4px var(--c)}
.card .g-card{background:var(--white);backdrop-filter:none;-webkit-backdrop-filter:none}

/* podium */
.podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));align-items:end;gap:10px;padding-top:6px}
.pod{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;min-width:0}
.pod b{font-size:12.5px;font-weight:650;line-height:1.2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:100%}
.pod-v{font:800 19px var(--f-display);letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.pod-av{position:relative;margin-bottom:4px;animation:popIn .6s cubic-bezier(.3,1.5,.5,1) backwards;animation-delay:calc(var(--i)*.15s + .7s)}
.pod-av .av{box-shadow:0 0 0 3px var(--white),0 10px 20px -8px rgba(13,27,42,.45)}
.pod-av em{position:absolute;right:-4px;bottom:-4px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font:800 12px var(--f-display);font-style:normal;color:var(--white);background:var(--m);box-shadow:0 0 0 2px var(--white)}
.pod.p1{--m:var(--saffron);--bh:112px}.pod.p2{--m:#8E9BAA;--bh:82px}.pod.p3{--m:#C27A45;--bh:62px}
.pod-block{position:relative;width:100%;height:var(--bh);margin-top:16px;border-radius:10px 10px 6px 6px;display:grid;place-items:start center;padding-top:8px;color:rgba(255,255,255,.95);font:800 24px var(--f-display);background:linear-gradient(180deg,color-mix(in srgb,var(--m) 60%,white),color-mix(in srgb,var(--m) 88%,black));box-shadow:0 20px 30px -18px var(--m);transform-origin:bottom;animation:barUp .9s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*.15s + .2s)}
.pod-block::before{content:"";position:absolute;left:6px;right:6px;bottom:100%;height:12px;background:color-mix(in srgb,var(--m) 35%,white);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}
.pod:hover .pod-block{filter:brightness(1.08)}
.lb-rest{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.lb-rest li{display:grid;grid-template-columns:20px auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:7px 8px;border-radius:12px;font-size:13.5px}
.lb-rest li:hover{background:rgba(255,255,255,.75)}
.lb-rest a{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-rest b{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.lb-rest .mono{color:var(--ink-3);font-size:12px}

/* activity timeline */
.act-f button{height:30px;padding:0 11px;font-size:12.5px}
.act{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;position:relative}
.act::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:2px;background:linear-gradient(var(--line-2),transparent)}
.act li{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding:6px 0;animation:slideIn .6s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*80ms + .15s)}
.act-ic{position:relative;z-index:1;width:36px;height:36px;margin-top:6px;border-radius:12px;display:grid;place-items:center;color:var(--c);background:color-mix(in srgb,var(--c) 14%,white);border:1px solid color-mix(in srgb,var(--c) 28%,white);box-shadow:0 0 0 4px var(--glass-strong)}
.act-ic svg{width:16px;height:16px}
.act-body{min-width:0;display:flex;flex-direction:column;gap:4px;padding:10px 13px;border-radius:14px;background:rgba(255,255,255,.7);border:1px solid var(--line);transition:background .2s,transform .2s,box-shadow .2s}
.act li:hover .act-body{background:var(--white);transform:translateX(3px);box-shadow:0 12px 22px -16px rgba(13,27,42,.45)}
.act-who{display:flex;align-items:center;flex-wrap:wrap;gap:4px 8px;font-size:13px;color:var(--ink-2);line-height:1.35}
.act-who a{display:inline-flex;align-items:center;gap:6px;font-weight:650;color:var(--ink)}
.act-who a:hover{color:var(--lagoon-deep)}
.act-obj{font-size:13.5px;line-height:1.4;font-weight:550;color:var(--ink);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.act time{font:500 11.5px var(--f-mono);color:var(--ink-3)}
.chip .pulse{width:7px;height:7px;border-radius:50%;background:var(--mint);animation:pulse 2.4s infinite}

/* attention cards */
.att-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:14px}
.att{position:relative;border-radius:20px;padding:16px;display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px 12px;align-items:center;animation:cardRise .8s cubic-bezier(.2,.8,.2,1) backwards;animation-delay:calc(var(--i)*80ms + .1s)}
.att-ring{position:relative;width:64px;height:64px}
.att-ring svg{position:absolute;inset:0;width:100%;height:100%}
.att-ring .av{position:absolute;left:8px;top:8px}
.att-main{min-width:0}
.att-main b{display:block;font-size:14px;font-weight:650;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.att-main small{display:block;font-size:12.5px;color:var(--ink-3)}
.att-pct{font:800 20px var(--f-display);color:var(--c);font-variant-numeric:tabular-nums}
.att-miss{grid-column:1/-1;display:flex;gap:7px;align-items:center;font-size:12.5px;color:var(--ink-2);padding:8px 10px;border-radius:10px;background:color-mix(in srgb,var(--c) 10%,white)}
.att-miss svg{width:14px;height:14px;flex:none;color:var(--c)}
.att-btn{grid-column:1/-1;justify-self:start;position:relative;z-index:2}

.motion .rv:not(.in) :is(.att,.pod-av,.pod-block,.act li){animation:none}
.instant .att{animation:none!important}

/* ===== signed-out shell ===== */
.signed-out .side,.signed-out .topbar{display:none}
.signed-out .app{grid-template-columns:minmax(0,1fr)}
.signed-out main{padding:0}
.signed-out .wrap{max-width:none;gap:0}
.userchip{display:flex;align-items:center;gap:10px;padding:4px 5px 4px 4px;border-radius:999px;background:var(--glass-strong);border:1px solid var(--glass-edge);box-shadow:0 6px 20px -14px rgba(13,27,42,.3)}
.userchip:empty{display:none}
.uc-name b{display:block;font-size:13px;line-height:1.15}
.uc-name small{display:block;font-size:11.5px;color:var(--ink-3)}
.userchip .icon-btn{border-radius:50%;width:34px;height:34px}

/* ===== auth layout ===== */
.auth{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);min-height:100vh}
.auth-stage{position:relative;overflow:hidden;isolation:isolate;display:flex;flex-direction:column;gap:18px;padding-block:28px 40px;padding-left:max(40px,env(safe-area-inset-left,0px));padding-right:40px;border-right:1px solid var(--glass-edge);background:
  radial-gradient(60% 60% at 18% 12%,color-mix(in srgb,var(--lagoon) 45%,white),transparent 65%),
  radial-gradient(50% 55% at 88% 18%,color-mix(in srgb,var(--iris) 36%,white),transparent 65%),
  radial-gradient(55% 50% at 50% 100%,color-mix(in srgb,var(--saffron) 34%,white),transparent 70%),
  linear-gradient(140deg,color-mix(in srgb,var(--lagoon) 18%,white),var(--white))}
.auth-stage::before{content:"";position:absolute;inset:-50%;background:conic-gradient(from 0deg,transparent 0 30%,rgba(255,255,255,.4) 40%,transparent 52%);animation:spin 30s linear infinite;z-index:-1}
.auth-field{position:absolute;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.auth-brand{position:relative;z-index:2;width:max-content}
.deck-wrap{position:relative;z-index:1;flex:1;min-height:360px;perspective:1300px;display:grid;place-items:center}
.deck{position:relative;width:170px;height:240px;transform-style:preserve-3d}
.dcard{position:absolute;inset:0;border-radius:20px;padding:10px;display:flex;flex-direction:column;gap:3px;background:linear-gradient(160deg,rgba(255,255,255,.97),rgba(255,255,255,.86));box-shadow:0 30px 50px -26px rgba(13,27,42,.45),inset 0 0 0 1px rgba(255,255,255,.95);backface-visibility:hidden;-webkit-backface-visibility:hidden}
.dc-photo{position:relative;height:142px;border-radius:14px;overflow:hidden;margin-bottom:5px;background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.7),transparent 45%),linear-gradient(155deg,color-mix(in srgb,var(--c1) 70%,white),color-mix(in srgb,var(--c2) 65%,white))}
.dc-photo img{width:100%;height:100%;object-fit:cover;display:block}
.dc-tag{position:absolute;left:8px;top:8px;padding:3px 8px;border-radius:99px;background:rgba(255,255,255,.88);font:600 10px var(--f-mono);letter-spacing:.05em}
.dcard>b{font:700 14px var(--f-display);letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dcard>span{font-size:11px;color:var(--ink-3)}
.dc-stats{display:flex;gap:12px;margin-top:auto;font-size:10.5px;color:var(--ink-3)}
.dc-stats b{font:800 14px var(--f-display);color:var(--ink);margin-right:3px}
.deck-floor{position:absolute;left:50%;bottom:2%;width:460px;max-width:90%;height:70px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,rgba(13,27,42,.18),transparent);filter:blur(6px);z-index:-1}
.auth-copy{position:relative;z-index:2;max-width:540px;animation:enter .9s cubic-bezier(.2,.8,.2,1) .2s backwards}
.auth-copy h1{font-size:clamp(30px,3.6vw,48px);font-weight:800;letter-spacing:-.04em;line-height:1.02}
.auth-copy p{color:var(--ink-2);margin-top:10px;font-size:15.5px}
.auth-feats{list-style:none;padding:0;margin:16px 0 0;display:flex;flex-wrap:wrap;gap:8px}
.auth-feats li{display:inline-flex;align-items:center;gap:7px;padding:7px 12px;border-radius:12px;background:rgba(255,255,255,.75);border:1px solid var(--glass-edge);font-size:13px;color:var(--ink-2)}
.auth-feats svg{width:15px;height:15px;color:var(--lagoon)}
.auth-side{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:32px;padding-left:24px;padding-right:max(24px,env(safe-area-inset-right,0px))}
.auth-card{width:min(450px,100%);border-radius:28px;padding:28px;background:var(--glass-strong);backdrop-filter:blur(24px) saturate(1.4);-webkit-backdrop-filter:blur(24px) saturate(1.4);border:1px solid var(--glass-edge);box-shadow:var(--shadow-lift);transition:transform .65s cubic-bezier(.5,0,.2,1),opacity .65s}
.auth-card.shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.auth-card.leaving{transform:perspective(1200px) rotateY(-30deg) translateX(80px) scale(.9);opacity:0}
.auth-fine{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.auth-fine svg{width:13px;height:13px}
.auth-tabs{position:relative;display:grid;grid-template-columns:1fr 1fr;padding:4px;border-radius:14px;background:rgba(13,27,42,.06);margin-bottom:22px}
.auth-tabs a{position:relative;z-index:1;text-align:center;padding:9px;font-size:13.5px;font-weight:600;color:var(--ink-2);border-radius:10px}
.auth-tabs a.on{color:var(--ink)}
.tab-ink{position:absolute;top:4px;bottom:4px;left:4px;width:calc(50% - 4px);border-radius:10px;background:var(--white);box-shadow:0 2px 8px -3px rgba(13,27,42,.25);transform:translateX(calc(var(--x) * 100%));animation:ink .45s cubic-bezier(.2,.8,.2,1)}
@keyframes ink{from{transform:translateX(calc((1 - var(--x)) * 100%))}}
.af-step{display:flex;flex-direction:column;gap:14px;animation:stepIn .55s cubic-bezier(.2,.8,.2,1) backwards}
@keyframes stepIn{from{opacity:0;transform:perspective(900px) translateX(36px) rotateY(-14deg)}}
.af-step h2{font-size:28px;font-weight:750;letter-spacing:-.03em;line-height:1.1}
.af-sub{color:var(--ink-2);font-size:14.5px;margin-top:-6px}
.af-sso{height:48px;width:100%;border-radius:14px;font-size:14.5px}
.af-or{display:flex;align-items:center;gap:12px;font-size:12.5px;color:var(--ink-3)}
.af-or::before,.af-or::after{content:"";flex:1;height:1px;background:var(--line-2)}
.af-form{display:flex;flex-direction:column;gap:12px}
.af-field{position:relative}
.af-input{width:100%;height:56px;border-radius:14px;border:1.5px solid var(--line-2);background:var(--white);padding:18px 46px 4px 46px;font:500 15px var(--f-body);color:var(--ink);transition:border-color .2s,box-shadow .2s}
textarea.af-input{height:auto;min-height:92px;padding:26px 14px 10px;resize:vertical;line-height:1.5;display:block}

  return {m,pubs,raw,shared:raw-pubs.length,cites:sum(pubs,x=>x.cites),years,top};
}

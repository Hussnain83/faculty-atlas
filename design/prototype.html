const gC=g=>`var(--${g.color})`;
function niceMax(m){if(m<=4)return 4;if(m<=6)return 6;if(m<=8)return 8;if(m<=10)return 10;const p=Math.pow(10,Math.floor(Math.log10(m))),n=m/p;return(n<=2?2:n<=2.5?2.5:n<=5?5:10)*p}
let uid=0;
function barChart(data,color,label){
  const W=520,H=210,pl=30,pr=6,pt=22,pb=26,iw=W-pl-pr,ih=H-pt-pb,id='g'+(uid++);
  const max=niceMax(Math.max(1,...data.map(d=>d.v))),n=data.length,slot=iw/n,bw=Math.min(30,slot*.6);
  let s=`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(label)}"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${color}"/><stop offset="1" style="stop-color:${color};stop-opacity:.35"/></linearGradient></defs>`;
  [0,max/2,max].forEach(t=>{const y=pt+ih-t/max*ih;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="tick" x="${pl-8}" y="${y+4}" text-anchor="end">${t}</text>`});
  data.forEach((d,i)=>{
    const x=pl+i*slot+(slot-bw)/2,bh=d.v/max*ih,y=pt+ih-bh,last=i===n-1,r=Math.min(7,bh/2,bw/2);
    if(d.v>0){s+=`<path d="M${x},${pt+ih}V${y+r}Q${x},${y} ${x+r},${y}H${x+bw-r}Q${x+bw},${y} ${x+bw},${y+r}V${pt+ih}Z" fill="url(#${id})" opacity="${last?1:.78}"/>`;
      s+=`<text class="val${last?' hi':''}" x="${x+bw/2}" y="${y-7}" text-anchor="middle">${d.v}</text>`}
    if(n<=8||i%2===n%2||last) s+=`<text class="xl" x="${x+bw/2}" y="${H-6}" text-anchor="middle">${n>8?"'"+d.l.slice(2):d.l}</text>`;
  });
  return s+'</svg>';
}
function spark(vals,color){
  const W=150,H=46,max=Math.max(1,...vals),st=W/(vals.length-1);
  const pts=vals.map((v,i)=>[i*st,H-4-(v/max)*(H-10)]);
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join('');
  const id='s'+(uid++),e=pts[pts.length-1];
  return `<svg class="spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${color};stop-opacity:.28"/><stop offset="1" style="stop-color:${color};stop-opacity:0"/></linearGradient></defs><path class="area" d="${line}L${W},${H}L0,${H}Z" fill="url(#${id})"/><path class="sl" pathLength="1" d="${line}" fill="none" style="stroke:${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle class="pt" cx="${e[0]-1}" cy="${e[1]}" r="3.5" style="fill:${color}" stroke="white" stroke-width="2"/></svg>`;
}

function initGalaxy(root){
  const gx=root.querySelector('#galaxy');if(!gx)return;
  const hero=root.querySelector('#ovhero'),pls=[...gx.querySelectorAll('.planet')];let a0=-.4,paused=false;
  gx.addEventListener('pointerenter',()=>{paused=true});gx.addEventListener('pointerleave',()=>{paused=false});
  gx.addEventListener('focusin',()=>{paused=true});gx.addEventListener('focusout',()=>{paused=false});
  if(hero)hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();hero.style.setProperty('--mx',((e.clientX-r.left)/r.width-.5).toFixed(3));hero.style.setProperty('--my',((e.clientY-r.top)/r.height-.5).toFixed(3))},{passive:true});
  const f=()=>{if(!gx.isConnected)return;if(!paused&&!still)a0+=.0032;
    const w=gx.clientWidth,h=gx.clientHeight,rx=Math.min(w*.36,250),ry=h*.27;
    pls.forEach((p,i)=>{const a=a0+i/pls.length*Math.PI*2,x=Math.cos(a)*rx,y=Math.sin(a)*ry,z=(Math.sin(a)+1)/2;
      p.style.transform=`translate(${(x-31).toFixed(1)}px,${(y-31).toFixed(1)}px) scale(${(.72+.4*z).toFixed(3)})`;p.style.zIndex=y>0?10:2;p.style.opacity=(.6+.4*z).toFixed(2)});
    if(!still)requestAnimationFrame(f)};
  f();
}

function careerCard(p,yrs,first){

  return `<div class="card glass s12 rv career" data-d="0">

function initGroup(root,keep){
  const hero=root.querySelector('#ghero');if(!hero)return;
  hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();hero.style.setProperty('--mx',((e.clientX-r.left)/r.width-.5).toFixed(3));hero.style.setProperty('--my',((e.clientY-r.top)/r.height-.5).toFixed(3))},{passive:true});

function initNet(wrap,keep){
  const canvas=wrap.querySelector('canvas'),tip=wrap.querySelector('.net-tip'),g=gById(wrap.dataset.group),ctx=canvas.getContext('2d');
  const col=(getComputedStyle(document.documentElement).getPropertyValue('--'+g.color)||'').trim()||'#0C9AA6',ink='#0D1B2A',gold='#EE9B12';
  const m=members(g.id),n=m.length,ids=new Set(m.map(p=>p.id));
  const nodes=m.map((p,i)=>{const y=n>1?1-(i+.5)/n*2:0,r=Math.sqrt(1-y*y),th=i*2.39996,img=new Image();img.src=portrait(p);return{p,x:Math.cos(th)*r,y:y*.9,z:Math.sin(th)*r,img,lead:g.lead===p.id,X:0,Y:0,R:0,s:1,k:0,zd:0}});
  const byP=Object.fromEntries(nodes.map(q=>[q.p.id,q])),ew={};
  PUBS.forEach(x=>{const a=x.authors.filter(v=>ids.has(v));for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){const key=[a[i],a[j]].sort().join('|');ew[key]=(ew[key]||0)+1}});
  const edges=Object.entries(ew).map(([key,w],i)=>{const[a,b]=key.split('|');return{a:byP[a],b:byP[b],w,off:(i*.37)%1}});
  let W=0,H=0,ry=.5,rx=-.2,drag=null,hover=null;
  const t0=keep||still?-1e7:performance.now();
  const size=()=>{const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);W=r.width;H=r.height;canvas.width=Math.max(1,W*d);canvas.height=Math.max(1,H*d);ctx.setTransform(d,0,0,d,0,0)};
  size();
  const onR=()=>{if(!canvas.isConnected){removeEventListener('resize',onR);return}size();if(still)draw(performance.now())};addEventListener('resize',onR);
  const ease=v=>1-Math.pow(1-Math.max(0,Math.min(1,v)),3);
  const proj=q=>{const cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),x1=q.x*cy+q.z*sy,z1=-q.x*sy+q.z*cy,y1=q.y*cx-z1*sx,z2=q.y*sx+z1*cx,R=Math.min(W*.4,H*.36),s=900/(900+z2*R);return[W/2+x1*R*s,H/2-14+y1*R*s,s,z2]};
  const pill=(x,y,w,h,r)=>{ctx.beginPath();if(ctx.roundRect)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h)};
  function drawNode(q){
    if(q.k<=0)return;const{X,Y,R}=q,fade=hover&&hover!==q?.55:1;
    ctx.globalAlpha=q.k*fade;
    ctx.save();ctx.shadowColor='rgba(13,27,42,.35)';ctx.shadowBlur=18*q.s;ctx.shadowOffsetY=8*q.s;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(X,Y,R+4,0,6.283);ctx.fill();ctx.restore();
    ctx.save();ctx.beginPath();ctx.arc(X,Y,R,0,6.283);ctx.clip();ctx.fillStyle='#fff';ctx.fillRect(X-R,Y-R,2*R,2*R);
    const bg=ctx.createLinearGradient(X-R,Y-R,X+R,Y+R);bg.addColorStop(0,q.p.pair[0]+'70');bg.addColorStop(1,q.p.pair[1]+'70');ctx.fillStyle=bg;ctx.fillRect(X-R,Y-R,2*R,2*R);
    if(q.img.complete&&q.img.naturalWidth)ctx.drawImage(q.img,X-R,Y-R,2*R,2*R);ctx.restore();
    ctx.lineWidth=q===hover?4:2.5;ctx.strokeStyle=q.lead?gold:col;ctx.beginPath();ctx.arc(X,Y,R+1.5,0,6.283);ctx.stroke();
    if(q.s>1.02||q===hover||q.lead){const name=q.lead?`${q.p.first} ${q.p.last} · Lead`:`${q.p.first} ${q.p.last}`;ctx.font='600 12px Geist, "Segoe UI", system-ui, sans-serif';const tw=ctx.measureText(name).width,ly=Y+R+17;
      ctx.fillStyle='rgba(255,255,255,.92)';pill(X-tw/2-9,ly-11,tw+18,22,11);ctx.fill();ctx.fillStyle=ink;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(name,X,ly)}
    ctx.globalAlpha=1;
  }
  function drawHub(el){
    const k=ease(el/500);if(k<=0)return;const X=W/2,Y=H/2-14,R=32*k;
    ctx.globalAlpha=k;ctx.save();ctx.shadowColor=col;ctx.shadowBlur=30;const gr=ctx.createRadialGradient(X-R*.35,Y-R*.35,2,X,Y,R);gr.addColorStop(0,'#ffffff');gr.addColorStop(.38,col);gr.addColorStop(1,col);ctx.fillStyle=gr;ctx.beginPath();ctx.arc(X,Y,R,0,6.283);ctx.fill();ctx.restore();
    ctx.fillStyle='#fff';ctx.font='800 17px "Bricolage Grotesque", system-ui, sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(g.short,X,Y+1);ctx.globalAlpha=1;
  }
  function draw(t){
    const el=t-t0,cx0=W/2,cy0=H/2-14;ctx.clearRect(0,0,W,H);
    nodes.forEach((q,i)=>{const[X,Y,s,z]=proj(q),k=ease((el-250-i*110)/650);q.k=k;q.s=s;q.zd=z;q.X=cx0+(X-cx0)*k;q.Y=cy0+(Y-cy0)*k;q.R=(q.lead?34:27)*s*(.4+.6*k)});

    ctx.setLineDash([]);ctx.lineCap='round';
    const eStart=500+n*110;
    edges.forEach((e,i)=>{const k=ease((el-eStart-i*90)/700);if(k<=0)return;const on=hover&&(e.a===hover||e.b===hover),dim=hover&&!on,depth=((e.a.zd+e.b.zd)/2+1)/2;
      ctx.globalAlpha=dim?.12:Math.min(1,(.35+.55*(1-depth))*(on?1.5:1));ctx.lineWidth=(1.4+e.w*1.5)*(on?1.4:1);ctx.strokeStyle=on?ink:col;
      ctx.beginPath();ctx.moveTo(e.a.X,e.a.Y);ctx.lineTo(e.a.X+(e.b.X-e.a.X)*k,e.a.Y+(e.b.Y-e.a.Y)*k);ctx.stroke();
      if(k>=1&&!still){const u=((el/1700)+e.off)%1;ctx.globalAlpha=dim?.2:.95;ctx.fillStyle=on?ink:'#fff';ctx.beginPath();ctx.arc(e.a.X+(e.b.X-e.a.X)*u,e.a.Y+(e.b.Y-e.a.Y)*u,2.2+e.w*.6,0,6.283);ctx.fill();ctx.lineWidth=1.5;ctx.strokeStyle=on?ink:col;ctx.stroke()}});
    ctx.globalAlpha=1;
    const order=[...nodes].sort((a,b)=>b.zd-a.zd);
    order.filter(q=>q.zd>=0).forEach(drawNode);drawHub(el);order.filter(q=>q.zd<0).forEach(drawNode);
  }
  const pick=(x,y)=>{let best=null,bz=1e9;nodes.forEach(q=>{const dx=x-q.X,dy=y-q.Y;if(q.k>.5&&dx*dx+dy*dy<=(q.R+5)**2&&q.zd<bz){best=q;bz=q.zd}});return best};
  const showTip=h=>{hover=h;canvas.style.cursor=h?'pointer':'grab';if(h){tip.innerHTML=`<b>${esc(h.p.name)}</b><span>${esc(h.p.title)} · ${pubsOf(h.p.id).length} papers</span>`;tip.style.left=h.X+'px';tip.style.top=(h.Y-h.R-12)+'px'}tip.classList.toggle('on',!!h);if(still)draw(performance.now())};
  canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,moved:0,ry,rx};try{canvas.setPointerCapture(e.pointerId)}catch(err){}});
  canvas.addEventListener('pointermove',e=>{const r=canvas.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;
    if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;drag.moved=Math.max(drag.moved,Math.abs(dx)+Math.abs(dy));ry=drag.ry+dx*.008;rx=Math.max(-1.1,Math.min(1.1,drag.rx+dy*.006));if(drag.moved>5&&hover)showTip(null);if(still)draw(performance.now());return}
    const h=pick(x,y);if(h!==hover)showTip(h)},{passive:true});
  const end=e=>{const moved=drag?drag.moved:99;drag=null;if(e.type==='pointerup'&&moved<6){const r=canvas.getBoundingClientRect(),h=pick(e.clientX-r.left,e.clientY-r.top);if(h)location.hash='p-'+h.p.id}};
  canvas.addEventListener('pointerup',end);canvas.addEventListener('pointercancel',end);
  canvas.addEventListener('pointerleave',()=>{if(!drag&&hover)showTip(null)});
  if(still){draw(performance.now());nodes.forEach(q=>{q.img.onload=()=>draw(performance.now())})}
  else{const loop=t=>{if(!canvas.isConnected)return;if(!drag&&!hover)ry+=.0022;draw(t);requestAnimationFrame(loop)};requestAnimationFrame(loop)}
}

/* ---------- animated charts ---------- */
function smooth(pts){let d=`M${pts[0][0].toFixed(1)},${pts[0][1].toFixed(1)}`;for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;d+=`C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d}
function comboChart(years,cBar,cLine){
  const W=640,H=250,pl=30,pr=40,pt=24,pb=28,iw=W-pl-pr,ih=H-pt-pb,id='c'+(uid++),base=pt+ih;
  const maxB=niceMax(Math.max(1,...years.map(d=>d.v)));let run=0;const cs=years.map(d=>run+=d.v);const maxC=niceMax(Math.max(1,run));
  const n=years.length,slot=iw/n,bw=Math.min(30,slot*.46);
  let s=`<svg class="chart combo" viewBox="0 0 ${W} ${H}" role="img" aria-label="Papers per year and running total, ${years[0].l} to ${years[n-1].l}"><defs><linearGradient id="${id}b" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${cBar}"/><stop offset="1" style="stop-color:${cBar};stop-opacity:.3"/></linearGradient><linearGradient id="${id}a" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${cLine};stop-opacity:.22"/><stop offset="1" style="stop-color:${cLine};stop-opacity:0"/></linearGradient></defs>`;
  [0,.5,1].forEach(f=>{const y=base-f*ih;s+=`<line class="grid" x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}"/><text class="tick" x="${pl-8}" y="${y+4}" text-anchor="end">${+(maxB*f).toFixed(1)}</text><text class="tick" x="${W-pr+8}" y="${y+4}" style="fill:${cLine}">${+(maxC*f).toFixed(1)}</text>`});
  const pts=cs.map((v,i)=>[pl+i*slot+slot/2,base-v/maxC*ih]),line=smooth(pts);
  s+=`<path class="area" d="${line}L${pts[n-1][0].toFixed(1)},${base}L${pts[0][0].toFixed(1)},${base}Z" fill="url(#${id}a)"/>`;
  years.forEach((d,i)=>{const x=pl+i*slot+(slot-bw)/2,bh=d.v/maxB*ih,y=base-bh,r=Math.min(7,bh/2,bw/2);
    s+=`<g class="slot"><title>${d.l}: ${d.v} ${d.v===1?'paper':'papers'}, ${cs[i]} in total</title><rect x="${(pl+i*slot).toFixed(1)}" y="${pt}" width="${slot.toFixed(1)}" height="${ih}" fill="transparent"/>${d.v?`<path class="bar" style="--i:${i}" d="M${x.toFixed(1)},${base}V${(y+r).toFixed(1)}Q${x.toFixed(1)},${y.toFixed(1)} ${(x+r).toFixed(1)},${y.toFixed(1)}H${(x+bw-r).toFixed(1)}Q${(x+bw).toFixed(1)},${y.toFixed(1)} ${(x+bw).toFixed(1)},${(y+r).toFixed(1)}V${base}Z" fill="url(#${id}b)"/>`:''}<text class="xl" x="${(x+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">'${d.l.slice(2)}</text></g>`});
  s+=`<path class="ln" pathLength="1" d="${line}" fill="none" style="stroke:${cLine}" stroke-width="3" stroke-linecap="round"/>`;
  pts.forEach((q,i)=>{s+=`<circle class="pt" style="--i:${i};fill:var(--white);stroke:${cLine}" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="${i===n-1?5.5:3.5}" stroke-width="2.5"/>`});
  const e=pts[n-1];s+=`<circle class="pulse-ring" cx="${e[0].toFixed(1)}" cy="${e[1].toFixed(1)}" r="6" fill="none" style="stroke:${cLine}" stroke-width="2"/>`;

const motion=!matchMedia('(prefers-reduced-motion: reduce)').matches&&'IntersectionObserver' in window;
if(motion)document.documentElement.classList.add('motion');
const still=!motion;
function initProfile(root){
  const hero=root.querySelector('#phero');if(!hero)return;
  const card=hero.querySelector('#idcard'),stage=hero.querySelector('#stage'),chips=[...hero.querySelectorAll('.oc')];
  let tx=0,ty=0,cx=0,cy=0,a0=0;
  hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();tx=(e.clientX-r.left)/r.width-.5;ty=(e.clientY-r.top)/r.height-.5},{passive:true});
  hero.addEventListener('pointerleave',()=>{tx=0;ty=0});
  const frame=t=>{
    if(!hero.isConnected)return;
    cx+=(tx-cx)*.07;cy+=(ty-cy)*.07;
    const idle=still?0:Math.sin(t*.0005)*7;
    card.style.transform=`rotateY(${(cx*32+idle).toFixed(2)}deg) rotateX(${(-cy*24).toFixed(2)}deg)`;
    card.style.setProperty('--gx',(50+cx*160).toFixed(1)+'%');card.style.setProperty('--gy',(50+cy*160).toFixed(1)+'%');card.style.setProperty('--sx',(40+cx*70+idle*3).toFixed(1)+'%');
    hero.style.setProperty('--mx',cx.toFixed(3));hero.style.setProperty('--my',cy.toFixed(3));
    const w=stage.clientWidth,rx=Math.max(90,Math.min(240,w/2-30)),N=chips.length;
    if(!still)a0+=.0042;
    chips.forEach((c,i)=>{const a=a0+i/N*Math.PI*2,z=Math.sin(a),x=Math.cos(a)*rx+cx*40*z,y=((i%3)-1)*118+Math.sin(a+1)*26+cy*30*z,d=(z+1)/2;
      c.style.transform=`translate(-50%,-50%) translate(${x.toFixed(1)}px,${y.toFixed(1)}px) scale(${(.78+.24*d).toFixed(3)})`;c.style.opacity=(.38+.62*d).toFixed(2);c.style.zIndex=z>0?10:1});
    if(!still)requestAnimationFrame(frame);
  };
  frame(0);
  const sp=root.querySelector('#sphere');if(sp)initSphere(sp);
}
function initSphere(el){
  const tags=[...el.querySelectorAll('.st')],n=tags.length;if(!n)return;
  const pts=tags.map((_,i)=>{const y=1-(i+.5)/n*2,r=Math.sqrt(1-y*y),th=i*2.39996;return[Math.cos(th)*r,y,Math.sin(th)*r]});
  let vx=.002,vy=.004,tvx=vx,tvy=vy,rx=.35,ry=0;
  el.addEventListener('pointermove',e=>{const r=el.getBoundingClientRect();tvy=((e.clientX-r.left)/r.width-.5)*.035;tvx=-((e.clientY-r.top)/r.height-.5)*.035},{passive:true});
  el.addEventListener('pointerleave',()=>{tvx=.002;tvy=.004});
  const f=()=>{if(!el.isConnected)return;vx+=(tvx-vx)*.05;vy+=(tvy-vy)*.05;if(!still){rx+=vx;ry+=vy}
    const W=el.clientWidth*.34,H=el.clientHeight*.36,cX=Math.cos(rx),sX=Math.sin(rx),cY=Math.cos(ry),sY=Math.sin(ry);
    tags.forEach((t,i)=>{const[x,y,z]=pts[i],x1=x*cY+z*sY,z1=-x*sY+z*cY,y1=y*cX-z1*sX,z2=y*sX+z1*cX,d=(z2+1)/2;
      t.style.transform=`translate(-50%,-50%) translate(${(x1*W).toFixed(1)}px,${(y1*H).toFixed(1)}px) scale(${(.62+.5*d).toFixed(3)})`;t.style.opacity=(.28+.72*d).toFixed(2);t.style.zIndex=Math.round(d*100)});
    if(!still)requestAnimationFrame(f)};
  f();
}
let io=null;
function setupReveal(root,instant){
  if(io)io.disconnect();
  const els=[...root.querySelectorAll('.rv')];
  if(instant||!motion){els.forEach(e=>e.classList.add('in'));return}
  io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){io.unobserve(en.target);reveal(en.target)}}),{threshold:0,rootMargin:'0px 0px -12% 0px'});
  els.forEach(e=>io.observe(e));
  setTimeout(()=>els.forEach(e=>{if(e.isConnected)reveal(e)}),6000);
}
function reveal(e){if(e._rv)return;e._rv=1;setTimeout(()=>{e.classList.add('in');countUps(e,true)},+(e.dataset.d||0))}
const finePtr=matchMedia('(hover:hover) and (pointer:fine)').matches;let tiltEl=null;
document.addEventListener('pointermove',e=>{if(!finePtr||still)return;const t=e.target.closest&&e.target.closest('.tilt');if(tiltEl&&tiltEl!==t){tiltEl.style.transform='';tiltEl=null}if(!t)return;tiltEl=t;const r=t.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;t.style.transform=`perspective(700px) rotateY(${(x*14).toFixed(2)}deg) rotateX(${(-y*14).toFixed(2)}deg) translateZ(8px)`;t.style.setProperty('--gx',((x+.5)*100).toFixed(1)+'%');t.style.setProperty('--gy',((y+.5)*100).toFixed(1)+'%')},{passive:true});

function authSubmit(f){

  }

  const cols=['#0C9AA6','#5864EC','#F2614C','#EE9B12','#1FA872'];
  const ps=Array.from({length:150},()=>{const a=Math.random()*Math.PI*2,s=4+Math.random()*9;return{x:ox,y:oy,vx:Math.cos(a)*s,vy:Math.sin(a)*s-6,r:Math.random()*6.28,vr:(Math.random()-.5)*.3,w:5+Math.random()*6,h:8+Math.random()*8,c:cols[Math.floor(Math.random()*5)]}});

/* ---------- floating numbers engine ---------- */
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const fields=new Set();const mouse={x:.5,y:.5,tx:.5,ty:.5};let running=false;
function makeField(canvas,o){
  const f={canvas,ctx:canvas.getContext('2d'),o,items:[],w:0,h:0};
  f.size=()=>{const r=canvas.getBoundingClientRect(),d=Math.min(devicePixelRatio||1,2);f.w=r.width;f.h=r.height;canvas.width=Math.max(1,r.width*d);canvas.height=Math.max(1,r.height*d);f.ctx.setTransform(d,0,0,d,0,0);
    const n=Math.round(Math.min(o.max,(r.width*r.height)/o.area));f.items=Array.from({length:n},()=>spawn(f,true));if(reduce)draw(f,0)};
  f.size();fields.add(f);go();return f;
}
function spawn(f,any){const o=f.o,z=Math.random();return{t:o.tokens[Math.floor(Math.random()*o.tokens.length)],x:Math.random()*f.w,y:any?Math.random()*f.h:f.h+40,z,s:o.size[0]+(o.size[1]-o.size[0])*z*z,a:o.alpha[0]+(o.alpha[1]-o.alpha[0])*z,c:o.colors[Math.floor(Math.random()*o.colors.length)],ph:Math.random()*6.28,v:o.speed*(.35+z)}}
function draw(f,t){
  const{ctx,w,h,o}=f;ctx.clearRect(0,0,w,h);const px=mouse.x-.5,py=mouse.y-.5;ctx.textBaseline='middle';
  for(const it of f.items){
    if(!reduce){it.y-=it.v;if(it.y<-40)Object.assign(it,spawn(f,false))}
    ctx.globalAlpha=it.a;ctx.fillStyle=it.c;ctx.font=`${it.z>.66?600:500} ${it.s.toFixed(1)}px ${o.font}`;
    ctx.fillText(it.t,it.x+Math.sin(t*.00022+it.ph)*16-px*it.z*o.par,it.y-py*it.z*o.par);
  }ctx.globalAlpha=1;
}
function loop(t){mouse.x+=(mouse.tx-mouse.x)*.05;mouse.y+=(mouse.ty-mouse.y)*.05;for(const f of fields){if(!f.canvas.isConnected){fields.delete(f);continue}draw(f,t)}if(fields.size)requestAnimationFrame(loop);else running=false}
function go(){if(!running&&!reduce){running=true;requestAnimationFrame(loop)}}
addEventListener('pointermove',e=>{mouse.tx=e.clientX/innerWidth;mouse.ty=e.clientY/innerHeight},{passive:true});
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>fields.forEach(f=>f.size()),120)});
const MONO='"Geist Mono", ui-monospace, Consolas, monospace';
const GLOBAL_TOKENS=['2026','2025','2024','2019','2012','1998','π','Σ','∫','∂','λ','μ','σ²','∇','Δ','∞','h=17','h=24','p<0.05','r=0.82','n=1,284','IF 4.2','Q1','DOI','10.1109','10.1016','et al.','3.14159','e≈2.718','42','128','1,342','ORCID','arXiv','x̄','β₁','χ²','log n','O(n²)','f(x)'];
makeField(document.getElementById('field'),{tokens:GLOBAL_TOKENS,colors:['#0C9AA6','#5864EC','#F2614C','#EE9B12','#0D1B2A'],alpha:[.05,.17],size:[11,34],area:15000,max:110,speed:.16,par:46,font:MONO});

function countUps(root,force){if(reduce)return;root.querySelectorAll('[data-count]').forEach(el=>{if(!force&&motion&&el.closest('.rv'))return;const end=+el.dataset.count;if(!end)return;const t0=performance.now();const step=n=>{const p=Math.min(1,(n-t0)/1100),e=1-Math.pow(1-p,3);el.textContent=fmt(Math.round(end*e));if(p<1)requestAnimationFrame(step)};requestAnimationFrame(step)})}

  if(!/^image\//.test(file.type)){toast('Choose an image file, such as a JPG or PNG');return}
  const p=byId(document.getElementById('drawer-body').dataset.person),r=new FileReader();
  r.onload=()=>{const img=new Image();img.onload=()=>{const S=480,c=document.createElement('canvas'),m=Math.min(img.width,img.height);c.width=c.height=S;c.getContext('2d').drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,S,S);p.photo=c.toDataURL('image/jpeg',.88);refreshDrawer();render(true);toast('Photo updated on your profile')};img.onerror=()=>toast('That image could not be read. Try a JPG or PNG.');img.src=r.result};
  r.readAsDataURL(file);
}
document.addEventListener('dragover',e=>{const d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();d.classList.add('over')}});
document.addEventListener('dragleave',e=>{const d=e.target.closest&&e.target.closest('.drop');if(d)d.classList.remove('over')});
document.addEventListener('drop',e=>{const d=e.target.closest&&e.target.closest('.drop');if(d){e.preventDefault();d.classList.remove('over');const f=e.dataTransfer.files[0];if(f)(d.dataset.kind==='photo'?takePhoto:takeCV)(f)}});
document.addEventListener('submit',e=>{
  const f=e.target;e.preventDefault();if(authSubmit(f))return;
  if(f.id==='global-search'){state.dirQ=document.getElementById('gs').value;state.dirG='all';if(location.hash==='#people')render(true);else location.hash='people';return}
  const dp=document.getElementById('drawer-body');const p=dp&&byId(dp.dataset.person);
  if(f.id==='pub-form'){
    const y=+document.getElementById('pf-year').value;
    PUBS.forEach(x=>delete x._new);
    PUBS.push({id:'u'+PUBS.length,_new:1,title:document.getElementById('pf-title').value.trim(),venue:document.getElementById('pf-venue').value.trim(),type:document.getElementById('pf-type').value,year:y,doi:document.getElementById('pf-doi').value.trim()||'pending',cites:0,authors:[p.id],ext:[]});
    ACT.unshift({who:p.id,what:'added a publication',obj:document.getElementById('pf-title').value.trim(),when:'Just now',k:'pub'});
    state.pubFilter='All';closeOverlay();render(true);toast('Publication added to your profile');
    setTimeout(()=>{const n=document.querySelector('.pub.new');n&&n.scrollIntoView({behavior:reduce?'auto':'smooth',block:'center'})},60);
  }
  if(f.id==='skill-form'){const n=document.getElementById('sk-name').value.trim(),c=document.getElementById('sk-cat').value;if(n&&!p.skills[c].includes(n)){p.skills[c].push(n);refreshDrawer();render(true);toast(`${n} added to your skills`);document.getElementById('sk-name')?.focus()}}
  if(f.id==='bio-form'){p.bio=document.getElementById('bio').value.trim();closeOverlay();render(true);toast('Bio saved')}
  if(f.id==='ach-form'){const tt=document.getElementById('af-title').value.trim();p.achievements.push({kind:document.getElementById('af-kind').value,title:tt,org:document.getElementById('af-org').value.trim(),year:+document.getElementById('af-year').value});ACT.unshift({who:p.id,what:'added an achievement',obj:tt,when:'Just now',k:'award'});closeOverlay();render(true);toast('Achievement added to your profile')}
  if(f.id==='group-form'){
    const name=document.getElementById('ng-name').value.trim();if(!name)return;
    const id='g'+Date.now().toString(36),words=name.replace(/&/g,' ').split(/\s+/).filter(w=>w.length>2);
    GROUPS.push({id,name,short:(words[0]?.[0]||'N').toUpperCase()+(words[1]?.[0]||words[0]?.[1]||'G').toUpperCase(),color:(f.querySelector('input[name=ng-color]:checked')||{}).value||'mint',lead:null,since:2026,desc:document.getElementById('ng-desc').value.trim()||'A new research group. Add a description from the group settings.'});
    closeOverlay();location.hash='group-'+id;toast(`${name} created. Add members from the directory.`);setTimeout(()=>openAdd(id),450);
  }
});
document.addEventListener('keydown',e=>{authKey(e);const fl=document.activeElement;if((e.key==='Enter'||e.key===' ')&&fl&&fl.classList&&fl.classList.contains('flip')){e.preventDefault();fl.click();return}if(e.key==='Escape')closeOverlay();if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)){e.preventDefault();document.getElementById('gs').focus()}});

loadAuth();
render();
})();
</script>

<!--
  Faculty Atlas sign-in code email.
  Paste into Supabase → Authentication → Emails → Templates → "Magic link".
  Subject line to use:  Your Faculty Atlas code: {{ .Token }}
  The app asks people to type the code, so the email shows the code, not a link.
-->
<div style="margin:0;padding:32px 16px;background:#eef6f7;font-family:-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;color:#0d1b2a">
  <div style="max-width:460px;margin:0 auto;background:#ffffff;border-radius:20px;padding:32px;box-shadow:0 20px 40px -24px rgba(13,27,42,.35)">
    <p style="margin:0 0 4px;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#0c9aa6;font-weight:700">Faculty Atlas</p>
    <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3">Your sign-in code</h1>
    <p style="margin:0 0 20px;font-size:15px;line-height:1.55;color:#3d4d5c">
      Enter this code on the Faculty Atlas page to activate your account or reset your password.
    </p>
    <p style="margin:0 0 20px;padding:16px;border-radius:14px;background:#e6f6f7;text-align:center;font:700 30px/1.2 'SFMono-Regular',Consolas,monospace;letter-spacing:.3em;color:#0d1b2a">{{ .Token }}</p>
    <p style="margin:0 0 6px;font-size:13px;line-height:1.5;color:#5b6b7a">The code expires in one hour and can be used once.</p>
    <p style="margin:0;font-size:13px;line-height:1.5;color:#5b6b7a">If you did not ask for it, you can ignore this email. Nobody can sign in without the code.</p>
  </div>
</div>
